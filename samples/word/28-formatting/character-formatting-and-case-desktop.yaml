order: 4
id: word-formatting-character-formatting-and-case-desktop
name: Character formatting and case (desktop)
description: Reads a paragraph's character formatting and converts its text to uppercase.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-formatting").addEventListener("click", () => tryCatch(getFormatting));
        document.getElementById("set-case").addEventListener("click", () => tryCatch(setCase));

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.insertText("Project summary: the team is ready for review.", Word.InsertLocation.replace);
                const sampleRange: Word.Range = body.getRange(Word.RangeLocation.content);
                sampleRange.font.reset();
                sampleRange.font.bold = true;
                sampleRange.font.italic = true;
                sampleRange.font.highlightColor = "#FFFF00";
                await context.sync();
                console.log("Created a bold, italic, yellow-highlighted sample paragraph.");
            });
        }

        async function getFormatting() {
            // Reads character formatting on the first paragraph.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.load("text,bold,italic,boldBidirectional,italicBidirectional,case,highlightColorIndex");
                await context.sync();
                console.log("First paragraph's formatting:", {
                    text: paragraphRange.text,
                    bold: paragraphRange.bold,
                    italic: paragraphRange.italic,
                    boldBidirectional: paragraphRange.boldBidirectional,
                    italicBidirectional: paragraphRange.italicBidirectional,
                    case: paragraphRange.case,
                    highlightColorIndex: paragraphRange.highlightColorIndex
                });
            });
        }

        async function setCase() {
            // Converts the first paragraph's text to uppercase.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const characterCase: Word.CharacterCase = Word.CharacterCase.upper;
                paragraphRange.case = characterCase;
                await context.sync();
                console.log("Converted the first paragraph's text to uppercase.");
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample demonstrates how to inspect a paragraph's character formatting
                and convert its text to uppercase.</p>
            <p><b>Support:</b> Requires WordApiDesktop 1.4 in Word on Windows or Mac,
                not Word on the web.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with a mixed-case summary formatted in bold, italic, and yellow highlighting.
                <b>Set up</b> restores the original text and formatting.</p>
            <button id="setup">Set up</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-formatting">Get character formatting</button>
            <button id="set-case">Convert summary to uppercase</button>
            <p><b>Get character formatting</b> reports the sample paragraph's text, case, and formatting values.</p>
        </section>
    language: html
