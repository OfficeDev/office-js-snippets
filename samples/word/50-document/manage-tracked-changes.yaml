order: 15
id: word-document-manage-tracked-changes
name: Manage tracked changes
description: Creates tracked changes and shows how to inspect, accept, and reject them.
host: WORD
api_set:
    WordApi: '1.6'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("get-all-tracked-changes").addEventListener("click", () => tryCatch(getAllTrackedChanges));
        document.getElementById("get-first-tracked-change-or-null").addEventListener("click", () => tryCatch(getFirstTrackedChangeOrNull));
        document.getElementById("get-first-tracked-change-range").addEventListener("click", () => tryCatch(getFirstTrackedChangeRange));
        document.getElementById("get-next-tracked-change").addEventListener("click", () => tryCatch(getNextTrackedChange));
        document.getElementById("accept-first-tracked-change").addEventListener("click", () => tryCatch(acceptFirstTrackedChange));
        document.getElementById("reject-first-tracked-change").addEventListener("click", () => tryCatch(rejectFirstTrackedChange));
        document.getElementById("accept-all-tracked-changes").addEventListener("click", () => tryCatch(acceptAllTrackedChanges));
        document.getElementById("reject-all-tracked-changes").addEventListener("click", () => tryCatch(rejectAllTrackedChanges));
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-range-tracked-changes").addEventListener("click", () => tryCatch(getRangeTrackedChanges));
        document.getElementById("get-range-revisions").addEventListener("click", () => tryCatch(getRangeRevisions));
        document.getElementById("get-first-revision-range").addEventListener("click", () => tryCatch(getFirstRevisionRange));
        document.getElementById("accept-first-revision").addEventListener("click", () => tryCatch(acceptFirstRevision));
        document.getElementById("reject-first-revision").addEventListener("click", () => tryCatch(rejectFirstRevision));

        async function getRangeRevisions() {
            // Reads revision metadata for the first paragraph on desktop Word.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const revisions: Word.RevisionCollection = paragraphRange.revisions;
                revisions.load("items/author,items/date,items/type,items/index,items/formatDescription");
                await context.sync();
                console.log(`Revisions in the first paragraph: ${revisions.items.length}`);
                revisions.items.forEach((revision: Word.Revision) => {
                    console.log("Revision properties:", {
                        author: revision.author,
                        date: revision.date,
                        type: revision.type,
                        index: revision.index,
                        formatDescription: revision.formatDescription,
                    });
                });
            });
        }

        async function getFirstRevisionRange() {
            // Reads and selects the text affected by the first revision.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const revisions: Word.RevisionCollection = paragraphRange.revisions;
                revisions.load("items");
                await context.sync();

                if (revisions.items.length === 0) {
                    console.warn("No revisions were found. Run Set up to create tracked changes.");
                    return;
                }

                const firstRevision: Word.Revision = revisions.items[0];
                const revisionRange: Word.Range = firstRevision.range;
                revisionRange.load("text");
                revisionRange.select();
                await context.sync();

                console.log(`First revision range text: ${revisionRange.text}`);
            });
        }

        async function acceptFirstRevision() {
            // Incorporates the first revision into the document.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const revisions: Word.RevisionCollection = paragraphRange.revisions;
                revisions.load("items");
                await context.sync();

                if (revisions.items.length === 0) {
                    console.warn("No revisions were found. Run Set up to create tracked changes.");
                    return;
                }

                const firstRevision: Word.Revision = revisions.items[0];
                firstRevision.accept();
                await context.sync();

                console.log("Accepted the first revision. Get revision metadata to inspect the remaining revisions.");
            });
        }

        async function rejectFirstRevision() {
            // Removes the first revision and restores the original content.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const revisions: Word.RevisionCollection = paragraphRange.revisions;
                revisions.load("items");
                await context.sync();

                if (revisions.items.length === 0) {
                    console.warn("No revisions were found. Run Set up to create tracked changes.");
                    return;
                }

                const firstRevision: Word.Revision = revisions.items[0];
                firstRevision.reject();
                await context.sync();

                console.log("Rejected the first revision. Get revision metadata to inspect the remaining revisions.");
            });
        }

        async function getRangeTrackedChanges() {
            // Gets the tracked changes inside the first paragraph.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const trackedChanges: Word.TrackedChangeCollection = paragraphRange.getTrackedChanges();
                trackedChanges.load("items/author,items/text,items/type");
                await context.sync();
                console.log(`Tracked changes in the first paragraph: ${trackedChanges.items.length}`);
                trackedChanges.items.forEach((change: Word.TrackedChange) => {
                    console.log({ author: change.author, text: change.text, type: change.type });
                });
            });
        }

        async function getAllTrackedChanges() {
          // Gets the tracked changes and logs their details.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            trackedChanges.load("items/author, items/date, items/text, items/type");
            await context.sync();

            if (trackedChanges.items.length === 0) {
              console.warn("No tracked changes were found.");
              return;
            }

            trackedChanges.items.forEach((trackedChange: Word.TrackedChange, index: number) => {
              console.log(`Tracked change ${index + 1}:`, {
                author: trackedChange.author,
                date: trackedChange.date,
                text: trackedChange.text,
                type: trackedChange.type,
              });
            });
          });
        }

        async function getFirstTrackedChangeOrNull() {
          // Safely gets the first tracked change without throwing an error when the collection is empty.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            const firstTrackedChange: Word.TrackedChange = trackedChanges.getFirstOrNullObject();
            firstTrackedChange.load(["author", "isNullObject", "text", "type"]);
            await context.sync();

            if (firstTrackedChange.isNullObject) {
              console.warn("No tracked changes were found.");
              return;
            }

            console.log("First tracked change:", {
              author: firstTrackedChange.author,
              text: firstTrackedChange.text,
              type: firstTrackedChange.type,
            });
          });
        }

        async function getFirstTrackedChangeRange() {
          // Gets the range of the first tracked change.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            const trackedChange: Word.TrackedChange = trackedChanges.getFirst();
            await context.sync();

            const range: Word.Range = trackedChange.getRange();
            range.load();
            await context.sync();

            console.log(`Tracked change range text: ${range.text}`);
          });
        }

        async function getNextTrackedChange() {
          // Gets the next (second) tracked change.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            await context.sync();

            const trackedChange: Word.TrackedChange = trackedChanges.getFirst();
            await context.sync();

            const nextTrackedChange: Word.TrackedChange = trackedChange.getNext();
            await context.sync();

            nextTrackedChange.load(["author", "date", "text", "type"]);
            await context.sync();

            console.log("Next tracked change:", {
              author: nextTrackedChange.author,
              date: nextTrackedChange.date,
              text: nextTrackedChange.text,
              type: nextTrackedChange.type,
            });
          });
        }

        async function acceptFirstTrackedChange() {
          // Accepts the first tracked change.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            const trackedChange: Word.TrackedChange = trackedChanges.getFirst();
            trackedChange.accept();
            await context.sync();

            console.log("Accepted the first tracked change.");
          });
        }

        async function rejectFirstTrackedChange() {
          // Rejects the first tracked change.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            const trackedChange: Word.TrackedChange = trackedChanges.getFirst();
            trackedChange.reject();
            await context.sync();

            console.log("Rejected the first tracked change.");
          });
        }

        async function acceptAllTrackedChanges() {
          // Accepts all tracked changes.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            trackedChanges.acceptAll();
            await context.sync();

            console.log("Accepted all tracked changes.");
          });
        }

        async function rejectAllTrackedChanges() {
          // Rejects all tracked changes.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const trackedChanges: Word.TrackedChangeCollection = body.getTrackedChanges();
            trackedChanges.rejectAll();
            await context.sync();

            console.log("Rejected all tracked changes.");
          });
        }

        async function setup() {
          // Replaces the document body and tracks text and formatting edits.
          await Word.run(async (context) => {
            const document: Word.Document = context.document;
            const body: Word.Body = document.body;

            document.changeTrackingMode = Word.ChangeTrackingMode.off;
            body.clear();
            body.insertParagraph("The quick brown fox jumps over the lazy dog.", Word.InsertLocation.start);
            await context.sync();

            document.changeTrackingMode = Word.ChangeTrackingMode.trackAll;
            await context.sync();

            const adjective: Word.Range = body.search("quick").getFirst();
            const animal: Word.Range = body.search("fox").getFirst();
            const ending: Word.Range = body.search("dog").getFirst();
            adjective.insertText("swift", Word.InsertLocation.replace);
            animal.delete();
            ending.insertText("hound", Word.InsertLocation.replace);
            const description: Word.Range = body.search("lazy").getFirst();
            description.font.bold = true;
            await context.sync();

            document.changeTrackingMode = Word.ChangeTrackingMode.off;
            await context.sync();

            console.log("Created tracked text edits and applied bold formatting.");
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            This sample shows how to create, inspect, and resolve tracked changes in a document.
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Create tracked changes</button>
            <p>Set up replaces the document body and turns off Track Changes when finished.
            Run it again to reset the sample after accepting or rejecting changes.</p>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-all-tracked-changes">Get all tracked changes</button>
            <button id="get-range-tracked-changes">Get tracked changes in first paragraph</button>
            <button id="get-range-revisions">Get revision metadata (desktop)</button>
            <button id="get-first-revision-range">Select the first revision's range (desktop)</button>
            <button id="accept-first-revision">Accept the first revision (desktop)</button>
            <button id="reject-first-revision">Reject the first revision (desktop)</button>
            <p>Revision actions require WordApiDesktop 1.4 on Windows or Mac.
            Other actions require WordApi 1.6.</p>
            <p>Revision metadata includes the author, date, type, index, and formatting description.
            To record the bold formatting edit, enable Track formatting in Word before Set up.
            The formatting description can be empty for text revisions.</p>
            <button id="get-first-tracked-change-or-null">Safely get the first tracked change</button>
            <button id="get-first-tracked-change-range">Get the first tracked change's range</button>
            <button id="get-next-tracked-change">Get the next tracked change</button>
            <button id="accept-first-tracked-change">Accept the first tracked change</button>
            <button id="reject-first-tracked-change">Reject the first tracked change</button>
            <button id="accept-all-tracked-changes">Accept all tracked changes</button>
            <button id="reject-all-tracked-changes">Reject all tracked changes</button>
        </section>
    language: html
