order: 10
id: word-ranges-split-words-of-first-paragraph
name: Split a paragraph into ranges
description: Splits a paragraph into word ranges and then traverses all the ranges to format each word, producing a "karaoke" effect.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("highlight").addEventListener("click", () => tryCatch(highlightWords));
        document.getElementById("get-next-sentence").addEventListener("click", () => tryCatch(getNextSentence));
        document.getElementById("get-next-sentence-safely").addEventListener("click", () => tryCatch(getNextSentenceSafely));

        async function highlightWords() {
          // Splits the first paragraph into words and highlights them in sequence.
          await Word.run(async (context) => {
            const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
            const words: Word.RangeCollection = paragraphRange.split([" "], false, true, true);
            words.load("text");

            await context.sync();

            for (let i = 0; i < words.items.length; i++) {
              if (i >= 1) {
                words.items[i - 1].font.highlightColor = "#FFFFFF";
              }
              words.items[i].font.highlightColor = "#FFFF00";

              await context.sync();
              await new Promise((resolve) => setTimeout(resolve, 200));
            }
          });
        }

        async function getNextSentence() {
            // Gets the sentence following the first sentence in the document.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const firstSentence: Word.Range = paragraphRange.getTextRanges(["?", "."], true).getFirst();
                const nextSentence: Word.Range = firstSentence.getNextTextRange(["?", "."], true);
                nextSentence.load("text");
                await context.sync();
                console.log(`Next sentence: ${nextSentence.text}`);
            });
        }

        async function getNextSentenceSafely() {
            // Checks for a sentence after the end of the document without throwing.
            await Word.run(async (context) => {
                const endRange: Word.Range = context.document.body.getRange(Word.RangeLocation.end);
                const nextSentence: Word.Range = endRange.getNextTextRangeOrNullObject([".", "?"], true);
                nextSentence.load("text");
                await context.sync();
                if (nextSentence.isNullObject) {
                    console.warn("There is no sentence after the end of the document.");
                    return;
                }
                console.log(`Next sentence: ${nextSentence.text}`);
            });
        }

        async function setup() {
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.clear();
            body.insertParagraph(
              "Do you want to create a solution that extends the functionality of Word? You can use the Office Add-ins platform to extend Word clients running on the web, on a Windows desktop, or on a Mac.",
              "Start"
            );
            body.paragraphs
              .getLast()
              .insertText(
                "Use add-in commands to extend the Word UI and launch task panes that run JavaScript that interacts with the content in a Word document. Any code that you can run in a browser can run in a Word add-in. Add-ins that interact with content in a Word document create requests to act on Word objects and synchronize object state.",
                "Replace"
              );
            await context.sync();
          });
        }

        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
           This sample demonstrates how to split a paragraph into word ranges and move between sentences.
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Add sample text</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="highlight">Highlight word by word</button>
            <button id="get-next-sentence">Get next sentence</button>
            <button id="get-next-sentence-safely">Check beyond the final sentence</button>
        </section>
    language: html
