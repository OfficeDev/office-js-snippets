order: 1
id: word-close-document-window
name: Close document window
description: Closes the active document window with the prompt-to-save option.
host: WORD
api_set:
    WordApiDesktop: '1.4'
script:
    content: |
        document.getElementById("close-with-save-prompt").addEventListener("click", () => tryCatch(closeWithSavePrompt));

        async function closeWithSavePrompt() {
            // Closes the active document window with Word's prompt-to-save option.
            if (!Office.context.requirements.isSetSupported("WordApiDesktop", "1.4")) {
                console.error("This sample requires WordApiDesktop 1.4 or later.");
                return;
            }

            await Word.run(async (context) => {
                const window: Word.Window = context.document.activeWindow;
                const saveChanges: Word.SaveConfiguration = Word.SaveConfiguration.promptToSaveChanges;
                const closeOptions: Word.WindowCloseOptions = { saveChanges };
                console.log("About to close the document window...");
                window.close(closeOptions);
                await context.sync();
            });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample closes the active document window with Word's prompt-to-save option.</p>
            <p><b>Support:</b> Requires Word on Windows or Mac with WordApiDesktop 1.4.
                This sample isn't supported in Word on the web.</p>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Use a document you can safely close. Closing its window may also close this task pane.</p>
            <button id="close-with-save-prompt">Close document window</button>
        </section>
    language: html
