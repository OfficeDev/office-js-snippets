order: 13
id: excel-worksheet-visibility
name: Visibility
description: Gets and sets worksheet visibility and registers handlers for worksheet visibility changes.
author: OfficeDev
host: EXCEL
api_set:
    ExcelApi: '1.17'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));

        document.getElementById("get-visibility").addEventListener("click", () => tryCatch(getVisibility));
        document.getElementById("hide-worksheet").addEventListener("click", () => tryCatch(hideWorksheet));
        document.getElementById("unhide-worksheet").addEventListener("click", () => tryCatch(unhideWorksheet));
        document.getElementById("register-worksheet-event").addEventListener("click", () => tryCatch(registerWorksheetEvent));
        document.getElementById("register-worksheet-collection-event").addEventListener("click", () => tryCatch(registerWorksheetCollectionEvent));

        async function getVisibility() {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getItem("VisibilitySample");

                // Load the visibility property so it can be read after context.sync().
                sheet.load("name, visibility");

                await context.sync();

                console.log(`The visibility of worksheet "${sheet.name}" is ${sheet.visibility}.`);
            });
        }

        async function hideWorksheet() {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getItem("VisibilitySample");

                // Set the worksheet visibility to hidden.
                sheet.visibility = Excel.SheetVisibility.hidden;

                await context.sync();
            });
        }

        async function unhideWorksheet() {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getItem("VisibilitySample");

                // Set the worksheet visibility to visible.
                sheet.visibility = Excel.SheetVisibility.visible;

                await context.sync();
            });
        }

        async function registerWorksheetEvent() {
            await Excel.run(async (context) => {
                const sheet = context.workbook.worksheets.getItem("VisibilitySample");

                // Register an event handler for visibility changes to this worksheet.
                sheet.onVisibilityChanged.add(onWorksheetVisibilityChanged);

                await context.sync();
                console.log("Registered the worksheet visibility changed event handler.");
            });
        }

        async function registerWorksheetCollectionEvent() {
            await Excel.run(async (context) => {
                // Register an event handler for visibility changes to any worksheet in the collection.
                context.workbook.worksheets.onVisibilityChanged.add(onWorksheetCollectionVisibilityChanged);

                await context.sync();
                console.log("Registered the worksheet collection visibility changed event handler.");
            });
        }

        async function onWorksheetVisibilityChanged(args: Excel.WorksheetVisibilityChangedEventArgs) {
            console.log(`Worksheet event: Visibility changed from ${args.visibilityBefore} to ${args.visibilityAfter}.`);
        }

        async function onWorksheetCollectionVisibilityChanged(args: Excel.WorksheetVisibilityChangedEventArgs) {
            console.log(`Worksheet collection event: Worksheet ${args.worksheetId} visibility changed from ${args.visibilityBefore} to ${args.visibilityAfter}.`);
        }

        async function setup() {
            await Excel.run(async (context) => {
                const oldSampleSheet = context.workbook.worksheets.getItemOrNullObject("VisibilitySample");
                oldSampleSheet.load("isNullObject");
                await context.sync();

                // Delete the sample worksheet if it already exists.
                if (!oldSampleSheet.isNullObject) {
                    oldSampleSheet.delete();
                }

                // Create and activate a new, blank worksheet.
                const sheet = context.workbook.worksheets.add("VisibilitySample");
                sheet.activate();

                await context.sync();
            });
        }

        /** Default helper for invoking an action and handling errors. */
        async function tryCatch(callback) {
            try {
                await callback();
            }
            catch (error) {
                // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample shows how to get and set worksheet visibility and how to use worksheet visibility changed events.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Create a blank worksheet</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-visibility">Get visibility</button>
            <button id="hide-worksheet">Hide worksheet</button>
            <button id="unhide-worksheet">Unhide worksheet</button>
            <p>Register one or both event handlers, and then hide or unhide the sample worksheet. Event details are logged to the console.</p>
            <button id="register-worksheet-event">Register worksheet event</button>
            <button id="register-worksheet-collection-event">Register worksheet collection event</button>
        </section>
    language: html
