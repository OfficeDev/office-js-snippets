order: 3
id: word-paragraph-get-paragraph-on-insertion-point
name: Get paragraph from insertion point
description: Gets the full paragraph containing the insertion point.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
script:
    content: |-
        document.getElementById("get-paragraph").addEventListener("click", () => tryCatch(getParagraph));
        document.getElementById("get-sentences").addEventListener("click", () => tryCatch(getSentences));
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));

        async function getParagraph() {
          await Word.run(async (context) => {
            // The collection of paragraphs of the current selection returns the full paragraphs contained in it.
            const paragraph: Word.Paragraph = context.document.getSelection().paragraphs.getFirst();
            paragraph.load("text");

            await context.sync();
            console.log(paragraph.text);
          });
        }

        async function getSentences() {
          // Gets complete sentences from the insertion point to the end of its paragraph.
          await Word.run(async (context) => {
            const selection: Word.Range = context.document.getSelection();
            const sentences: Word.RangeCollection = selection.getTextRanges(["."], false);
            sentences.load("$none");
            await context.sync();

            if (sentences.items.length === 0) {
              console.warn("No sentences were found. Place the insertion point in the sample text.");
              return;
            }
            const firstSentence: Word.Range = sentences.items[0];
            const paragraphEnd: Word.Range = selection.paragraphs.getFirst().getRange(Word.RangeLocation.end);
            const remainingRange: Word.Range = firstSentence.expandTo(paragraphEnd);
            const sentencesToTheEndOfParagraph: Word.RangeCollection = remainingRange.getTextRanges(["."], false);
            sentencesToTheEndOfParagraph.load("text");
            await context.sync();

            for (let i = 0; i < sentencesToTheEndOfParagraph.items.length; i++) {
              console.log(sentencesToTheEndOfParagraph.items[i].text);
            }
          });
        }

        async function setup() {
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.clear();
            body.insertParagraph(
              "Do you want to create a solution that extends the functionality of Word? You can use the Office Add-ins platform to extend Word clients running on the web, on a Windows desktop, or on a Mac.",
              "Start"
            );
            body.paragraphs
              .getLast()
              .insertText(
                "Use add-in commands to extend the Word UI and launch task panes that run JavaScript that interacts with the content in a Word document. Any code that you can run in a browser can run in a Word add-in. Add-ins that interact with content in a Word document create requests to act on Word objects and synchronize object state.",
                "Replace"
              );
            await context.sync();
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
          This sample demonstrates how to get the paragraph at the insertion point and the complete sentences that follow it.
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Setup</button>
        </section>
        <section>
            <h3>Try it out</h3>
        <span>Select an insertion point in the document.</span><p>
            <button id="get-paragraph">Get paragraph</button><p>
            <button id="get-sentences">Get sentences</button>
        </section>
    language: html
