order: 4
id: word-read-range-underline
name: Read range underline
description: Reads the underline type applied to a paragraph range.
author: OfficeDev
host: WORD
api_set:
    WordApi: preview
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-underline").addEventListener("click", () => tryCatch(getUnderline));

        async function getUnderline() {
            // Reads the underline applied to the first paragraph range.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.load("underline");
                await context.sync();
                const singleUnderline: Word.UnderlineType = Word.UnderlineType.single;
                console.log(`Underline type: ${paragraphRange.underline}`);
                console.log(`Has a single underline: ${paragraphRange.underline === singleUnderline}`);
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                context.document.body.clear();
                const summary: Word.Paragraph = context.document.body.insertParagraph("Underlined project summary.", Word.InsertLocation.start);
                summary.font.underline = Word.UnderlineType.single;
                await context.sync();
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>This sample shows how to inspect the underline applied to a project summary.</section>
        <section><p><b>Support:</b> Reading underline directly from a range is a preview API.</p></section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with an underlined sample paragraph.</p>
            <button id="setup">Add underlined summary</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-underline">Get range underline</button>
        </section>
    language: html
