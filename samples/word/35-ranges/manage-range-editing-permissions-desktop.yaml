order: 8
id: word-ranges-manage-range-editing-permissions-desktop
name: Manage range editing permissions (desktop)
description: Designates an editable range and reads its editing-permission entries.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("add-editor").addEventListener("click", () => tryCatch(addEditor));
        document.getElementById("get-editors").addEventListener("click", () => tryCatch(getEditors));

        async function addEditor() {
            // Grants everyone permission to edit the first paragraph when editing restrictions apply.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const editors: Word.EditorCollection = paragraphRange.editors;
                const editorType: Word.EditorType = Word.EditorType.everyone;
                const editor: Word.Editor = editors.addByType(editorType);
                await context.sync();
                console.log("Granted Everyone permission on the summary. Get editors to verify it.");
            });
        }

        async function getEditors() {
            // Reads editing-permission entries for the first paragraph range.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const editors: Word.EditorCollection = paragraphRange.editors;
                const editorCount: OfficeExtension.ClientResult<number> = editors.getCount();
                await context.sync();
                const editorEntries: Word.Editor[] = [];
                for (let index = 0; index < editorCount.value; index++) {
                    const editor: Word.Editor = editors.getItemAt(index);
                    editor.load("name,id");
                    editorEntries.push(editor);
                }
                await context.sync();
                console.log(`Editing-permission entries: ${editorCount.value}`);
                editorEntries.forEach((editor: Word.Editor) => console.log({ name: editor.name, id: editor.id }));
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.clear();
                body.insertParagraph("Project summary", Word.InsertLocation.start);
                body.insertParagraph("Additional project details.", Word.InsertLocation.end);
                await context.sync();
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>This sample demonstrates how to designate a project summary as editable and inspect its editing-permission entries.</section>
        <section><p><b>Support:</b> Requires WordApiDesktop 1.4 on Windows or Mac.</p></section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with a project summary and additional details.</p>
            <button id="setup">Create sample report</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="add-editor">Grant Everyone editing permission</button>
            <button id="get-editors">Get editing-permission entries</button>
            <p>The permission action does not protect the document. Get editing-permission entries verifies
            the designated editable range; permissions take effect when editing restrictions are enforced.</p>
        </section>
    language: html
