order: 4
id: word-formatting-manage-styles
name: Manage styles
description: Creates, applies, formats, and deletes custom styles in a Word document.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.6'
    WordApiDesktop: '1.1'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("count").addEventListener("click", () => tryCatch(getCount));
        document.getElementById("add-style").addEventListener("click", () => tryCatch(addStyle));
        document.getElementById("properties").addEventListener("click", () => tryCatch(getProperties));
        document.getElementById("apply-style").addEventListener("click", () => tryCatch(applyStyle));
        document.getElementById("font-properties").addEventListener("click", () => tryCatch(setFontProperties));
        document.getElementById("paragraph-format").addEventListener("click", () => tryCatch(setParagraphFormat));
        document.getElementById("set-border-type").addEventListener("click", () => tryCatch(setOutsideBorderType));
        document.getElementById("set-border-width").addEventListener("click", () => tryCatch(setOutsideBorderWidth));
        document.getElementById("set-border-color").addEventListener("click", () => tryCatch(setOutsideBorderColor));
        document.getElementById("get-border-properties").addEventListener("click", () => tryCatch(getOutsideBorderProperties));
        document.getElementById("set-background-color").addEventListener("click", () => tryCatch(setBackgroundColor));
        document.getElementById("set-foreground-color").addEventListener("click", () => tryCatch(setForegroundColor));
        document.getElementById("set-texture").addEventListener("click", () => tryCatch(setTexture));
        document.getElementById("get-shading").addEventListener("click", () => tryCatch(getShading));
        document.getElementById("delete-style").addEventListener("click", () => tryCatch(deleteStyle));

        async function setup() {
          // Creates a custom paragraph style and applies it to sample text.
          await Word.run(async (context) => {
            const styleName = "Sample Style";
            let sampleStyle: Word.Style = context.document.getStyles().getByNameOrNullObject(styleName);
            sampleStyle.load("isNullObject");
            await context.sync();

            if (sampleStyle.isNullObject) {
              sampleStyle = context.document.addStyle(styleName, Word.StyleType.paragraph);
            }

            const borders: Word.BorderCollection = sampleStyle.borders;
            borders.outsideBorderType = Word.BorderType.single;
            borders.outsideBorderWidth = Word.BorderWidth.pt100;
            borders.outsideBorderColor = "#C65911";

            const shading: Word.Shading = sampleStyle.shading;
            shading.backgroundPatternColor = "#FFF2CC";
            shading.foregroundPatternColor = "#C65911";
            shading.texture = Word.ShadingTextureType.lightTrellis;

            const body: Word.Body = context.document.body;
            body.clear();
            const sampleParagraph: Word.Paragraph = body.insertParagraph(
              "Use the task pane actions to change this custom paragraph style.",
              Word.InsertLocation.start
            );
            sampleParagraph.style = styleName;

            await context.sync();
            console.log("Created and applied the Sample Style custom paragraph style.");
          });
        }

        async function getCount() {
          // Gets the number of available styles stored with the document.
          await Word.run(async (context) => {
            const styles: Word.StyleCollection = context.document.getStyles();
            const count = styles.getCount();
            await context.sync();

            console.log(`Number of styles: ${count.value}`);
          });
        }

        async function addStyle() {
          // Adds a new style.
          await Word.run(async (context) => {
            const newStyleName = (document.getElementById("new-style-name") as HTMLInputElement).value;
            if (newStyleName == "") {
              console.warn("Enter a style name to add.");
              return;
            }

            const style: Word.Style = context.document.getStyles().getByNameOrNullObject(newStyleName);
            style.load("isNullObject");
            await context.sync();

            if (!style.isNullObject) {
              console.warn(
                `There's an existing style with the same name '${newStyleName}'. Enter another style name.`
              );
              return;
            }

            const newStyleType = ((document.getElementById("new-style-type") as HTMLSelectElement).value as unknown) as Word.StyleType;
            context.document.addStyle(newStyleName, newStyleType);
            await context.sync();

            console.log(`${newStyleName} was added to the style list.`);
          });
        }

        async function getProperties() {
          // Gets the properties of the specified style.
          await Word.run(async (context) => {
            const styleName = (document.getElementById("style-name-to-use") as HTMLInputElement).value;
            if (styleName == "") {
              console.warn("Enter a style name to get properties.");
              return;
            }

            const style: Word.Style = context.document.getStyles().getByNameOrNullObject(styleName);
            style.load("isNullObject, nameLocal, type");
            style.font.load("color, name, size");
            style.paragraphFormat.load("alignment, leftIndent");
            await context.sync();

            if (style.isNullObject) {
              console.warn(`There's no existing style with the name '${styleName}'.`);
            } else {
              console.log(`Style: ${style.nameLocal}`);
              console.log(`Type: ${style.type}`);
              console.log(`Font: ${style.font.name}, ${style.font.size} points, ${style.font.color}`);
              console.log(`Alignment: ${style.paragraphFormat.alignment}`);
              console.log(`Left indent: ${style.paragraphFormat.leftIndent} points`);
            }
          });
        }

        async function applyStyle() {
          // Applies the specified style to a paragraph.
          await Word.run(async (context) => {
            const styleName = (document.getElementById("style-name-to-use") as HTMLInputElement).value;
            if (styleName == "") {
              console.warn("Enter a style name to apply.");
              return;
            }

            const style: Word.Style = context.document.getStyles().getByNameOrNullObject(styleName);
            style.load("isNullObject, nameLocal, type");
            await context.sync();

            if (style.isNullObject) {
              console.warn(`There's no existing style with the name '${styleName}'.`);
            } else if (style.type != Word.StyleType.paragraph) {
              console.log(`The '${styleName}' style isn't a paragraph style.`);
            } else {
              const body: Word.Body = context.document.body;
              body.clear();
              const paragraph: Word.Paragraph = body.insertParagraph(
                "This paragraph uses a custom style.",
                Word.InsertLocation.start
              );
              paragraph.style = style.nameLocal;
              await context.sync();

              console.log(`Applied '${styleName}' to the sample paragraph.`);
            }
          });
        }

        async function setFontProperties() {
          // Sets the font color and size of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const font: Word.Font = sampleStyle.font;
            font.color = "#C00000";
            font.size = 20;
            await context.sync();

            console.log("Set the Sample Style font color to red and size to 20 points.");
          });
        }

        async function setParagraphFormat() {
          // Sets the alignment and left indent of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const paragraphFormat: Word.ParagraphFormat = sampleStyle.paragraphFormat;
            paragraphFormat.leftIndent = 30;
            paragraphFormat.alignment = Word.Alignment.centered;
            await context.sync();

            console.log("Centered the Sample Style text and set its left indent to 30 points.");
          });
        }

        async function setOutsideBorderType() {
          // Sets the outside border type of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const borders: Word.BorderCollection = sampleStyle.borders;
            borders.outsideBorderType = Word.BorderType.dashed;
            await context.sync();

            console.log("Set the Sample Style outside border type to dashed.");
          });
        }

        async function setOutsideBorderWidth() {
          // Sets the outside border width of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const borders: Word.BorderCollection = sampleStyle.borders;
            const borderWidth: Word.BorderWidth = Word.BorderWidth.pt225;
            borders.outsideBorderWidth = borderWidth;
            await context.sync();

            console.log("Set the Sample Style outside border width to 2.25 points.");
          });
        }

        async function setOutsideBorderColor() {
          // Sets the outside border color of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const borders: Word.BorderCollection = sampleStyle.borders;
            borders.outsideBorderColor = "#4472C4";
            await context.sync();

            console.log("Set the Sample Style outside border color to blue.");
          });
        }

        async function getOutsideBorderProperties() {
          // Gets the outside border properties of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const borders: Word.BorderCollection = sampleStyle.borders;
            borders.load("outsideBorderColor, outsideBorderType, outsideBorderWidth");
            await context.sync();

            console.log("Outside border color:", borders.outsideBorderColor);
            console.log("Outside border type:", borders.outsideBorderType);
            console.log("Outside border width:", borders.outsideBorderWidth);
          });
        }

        async function setBackgroundColor() {
          // Sets the background pattern color of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const shading: Word.Shading = sampleStyle.shading;
            shading.backgroundPatternColor = "#D9EAF7";
            await context.sync();

            console.log("Set the Sample Style background pattern color to light blue.");
          });
        }

        async function setForegroundColor() {
          // Sets the foreground pattern color of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const shading: Word.Shading = sampleStyle.shading;
            shading.foregroundPatternColor = "#1F4E78";
            await context.sync();

            console.log("Set the Sample Style foreground pattern color to dark blue.");
          });
        }

        async function setTexture() {
          // Sets the shading texture of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const shading: Word.Shading = sampleStyle.shading;
            const texture: Word.ShadingTextureType = Word.ShadingTextureType.darkTrellis;
            shading.texture = texture;
            await context.sync();

            console.log("Set the Sample Style shading texture to dark trellis.");
          });
        }

        async function getShading() {
          // Gets the pattern colors and texture of the sample style.
          await Word.run(async (context) => {
            const sampleStyle: Word.Style = context.document.getStyles().getByName("Sample Style");
            const shading: Word.Shading = sampleStyle.shading;
            shading.load("backgroundPatternColor, foregroundPatternColor, texture");
            await context.sync();

            console.log("Background pattern color:", shading.backgroundPatternColor);
            console.log("Foreground pattern color:", shading.foregroundPatternColor);
            console.log("Texture:", shading.texture);
          });
        }

        async function deleteStyle() {
          // Deletes the specified custom style.
          await Word.run(async (context) => {
            const styleName = (document.getElementById("style-name-to-delete") as HTMLInputElement).value;
            if (styleName == "") {
              console.warn("Enter a style name to delete.");
              return;
            }

            const style: Word.Style = context.document.getStyles().getByNameOrNullObject(styleName);
            style.load("isNullObject");
            await context.sync();

            if (style.isNullObject) {
              console.warn(`There's no existing style with the name '${styleName}'.`);
            } else {
              style.delete();
              await context.sync();

              console.log(`Deleted the custom style '${styleName}'.`);
            }
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>Create a reusable paragraph style, explore its formatting, and manage other custom styles in the document.</p>
            <p><b>Important:</b> Borders, foreground patterns, and textures require Word on Windows with WordApiDesktop 1.1.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Create the Sample Style with an outside border and patterned shading, then apply it to sample text.</p>
            <button id="setup">Set up the sample</button>
        </section>
        <section>
            <h3>Format the Sample Style</h3>
            <h4>Font and paragraph</h4>
            <button id="font-properties">Set font properties</button>
            <button id="paragraph-format">Set paragraph format</button>
            <h4>Outside border</h4>
            <button id="set-border-type">Set border type</button>
            <button id="set-border-width">Set border width</button>
            <button id="set-border-color">Set border color</button>
            <button id="get-border-properties">Get border properties</button>
            <h4>Shading</h4>
            <button id="set-background-color">Set background color</button>
            <button id="set-foreground-color">Set foreground color</button>
            <button id="set-texture">Set texture</button>
            <button id="get-shading">Get shading</button>
        </section>
        <section>
            <h3>Manage other styles</h3>
            <button id="count">Get style count</button>
            <h4>Add a custom style</h4>
            <p>Give the style an alphanumeric name that starts with a letter.</p>
            <label for="new-style-name">Name:</label>
            <input id="new-style-name" />
            <label for="new-style-type">Type:</label>
            <select id="new-style-type">
                <option>Paragraph</option>
                <option>Character</option>
                <option>List</option>
                <option>Table</option>
            </select>
            <button id="add-style">Add style</button>
            <h4>Use a custom style</h4>
            <label for="style-name-to-use">Style name:</label>
            <input id="style-name-to-use" />
            <button id="properties">Get properties</button>
            <button id="apply-style">Apply style to paragraph</button>
            <h4>Delete a custom style</h4>
            <label for="style-name-to-delete">Style name:</label>
            <input id="style-name-to-delete" />
            <button id="delete-style">Delete style</button>
        </section>
    language: html
style:
    content: |-
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
        }

        section {
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        h4 {
            margin-bottom: 8px;
        }

        p {
            margin: 0 0 10px 0;
        }

        label,
        input,
        select {
            display: block;
            margin-bottom: 8px;
        }

        input,
        select {
            box-sizing: border-box;
            padding: 6px;
            width: 100%;
        }

        button {
            background-color: #f0f0f0;
            color: #333333;
            border: 1px solid #8a8a8a;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
            margin-left: 20px;
            margin-bottom: 5px;
            min-width: 80px;
            display: block;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active {
            background-color: #d0d0d0;
        }
    language: css
libraries: |-
    https://officeapis.public.onecdn.static.microsoft/1/office.js
    https://raw.githubusercontent.com/DefinitelyTyped/DefinitelyTyped/master/types/office-js/index.d.ts
