order: 4
id: word-formatting-manage-language-and-proofing-desktop
name: Manage language and proofing (desktop)
description: Sets proofing languages, detects language, and manages spelling and grammar flags on sample text.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("set-language").addEventListener("click", () => tryCatch(setLanguage));
        document.getElementById("set-east-asian-language").addEventListener("click", () => tryCatch(setEastAsianLanguage));
        document.getElementById("set-other-language").addEventListener("click", () => tryCatch(setOtherLanguage));
        document.getElementById("reset-language-detection").addEventListener("click", () => tryCatch(resetLanguageDetection));
        document.getElementById("detect-language").addEventListener("click", () => tryCatch(detectLanguage));
        document.getElementById("disable-proofing").addEventListener("click", () => tryCatch(disableProofing));
        document.getElementById("reset-spelling").addEventListener("click", () => tryCatch(resetSpelling));
        document.getElementById("reset-grammar").addEventListener("click", () => tryCatch(resetGrammar));
        document.getElementById("get-proofing").addEventListener("click", () => tryCatch(getProofing));

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.insertText(
                    "The project summarry is ready for reveiw. The team will discuss the launch schedule tomorrow.",
                    Word.InsertLocation.replace
                );
                body.insertParagraph(
                    "\u3053\u306e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u306f\u6765\u9031\u958b\u59cb\u4e88\u5b9a\u3067\u3059\u3002",
                    Word.InsertLocation.end
                );
                const sampleRange: Word.Range = body.getRange(Word.RangeLocation.content);
                sampleRange.hasNoProofing = false;
                await context.sync();
                console.log("Created English and Japanese sample paragraphs with proofing enabled.");
            });
        }

        async function setLanguage() {
            // Sets the first paragraph's proofing language to US English.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const language: Word.LanguageId = Word.LanguageId.englishUS;
                paragraphRange.languageId = language;
                await context.sync();
                console.log("Set the English paragraph's proofing language to US English.");
            });
        }

        async function setEastAsianLanguage() {
            // Sets the Japanese paragraph's East Asian language.
            await Word.run(async (context) => {
                const japaneseRange: Word.Range = context.document.body.paragraphs.getLast().getRange(Word.RangeLocation.content);
                const language: Word.LanguageId = Word.LanguageId.japanese;
                japaneseRange.languageIdFarEast = language;
                await context.sync();
                console.log("Set the Japanese paragraph's East Asian language to Japanese.");
            });
        }

        async function setOtherLanguage() {
            // Sets the first paragraph's non-East-Asian language to US English.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const language: Word.LanguageId = Word.LanguageId.englishUS;
                paragraphRange.languageIdOther = language;
                await context.sync();
                console.log("Set the English paragraph's non-East-Asian language to US English.");
            });
        }

        async function resetLanguageDetection() {
            // Marks the first paragraph's language as not yet detected.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.languageDetected = false;
                await context.sync();
                console.log("Reset the English paragraph's language-detected flag. Get language and proofing settings to inspect it.");
            });
        }

        async function detectLanguage() {
            // Detects the language of the first paragraph's text.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const detection: OfficeExtension.ClientResult<boolean> = paragraphRange.detectLanguage();
                await context.sync();
                console.log(`English paragraph's language detected: ${detection.value}`);
            });
        }

        async function disableProofing() {
            // Disables spelling and grammar checking for the first paragraph.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.hasNoProofing = true;
                await context.sync();
                console.log("Disabled spelling and grammar checking for the English paragraph. Get language and proofing settings to verify it.");
            });
        }

        async function resetSpelling() {
            // Marks the first paragraph as needing another spelling check.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.spellingChecked = false;
                await context.sync();
                console.log("Reset the English paragraph's spelling-checked flag. Get language and proofing settings to inspect it.");
            });
        }

        async function resetGrammar() {
            // Marks the first paragraph as needing another grammar check.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.grammarChecked = false;
                await context.sync();
                console.log("Reset the English paragraph's grammar-checked flag. Get language and proofing settings to inspect it.");
            });
        }

        async function getProofing() {
            // Reads language and proofing settings from the English and Japanese paragraphs.
            await Word.run(async (context) => {
                const englishRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const japaneseRange: Word.Range = context.document.body.paragraphs.getLast().getRange(Word.RangeLocation.content);
                const sampleRanges: Word.Range[] = [englishRange, japaneseRange];
                sampleRanges.forEach((paragraphRange: Word.Range) => {
                    paragraphRange.load("text,languageId,languageIdFarEast,languageIdOther,languageDetected,hasNoProofing,spellingChecked,grammarChecked");
                });
                await context.sync();
                sampleRanges.forEach((paragraphRange: Word.Range, index) => {
                    const label = index === 0 ? "English paragraph" : "Japanese paragraph";
                    console.log(`${label}'s proofing settings:`, {
                        text: paragraphRange.text,
                        languageId: paragraphRange.languageId,
                        languageIdFarEast: paragraphRange.languageIdFarEast,
                        languageIdOther: paragraphRange.languageIdOther,
                        languageDetected: paragraphRange.languageDetected,
                        hasNoProofing: paragraphRange.hasNoProofing,
                        spellingChecked: paragraphRange.spellingChecked,
                        grammarChecked: paragraphRange.grammarChecked
                    });
                });
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample demonstrates how to assign proofing languages, detect language, and inspect or reset
                spelling and grammar flags using English and Japanese text.</p>
            <p><b>Support:</b> Requires WordApiDesktop 1.4 in Word on Windows or Mac, not Word on the web.
                Language detection and proofing feedback depend on Word's settings and installed language support.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with an English paragraph containing intentional spelling mistakes and
                a Japanese paragraph. Set up also re-enables proofing after the Disable proofing action.</p>
            <button id="setup">Set up</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>The actions target the English paragraph unless labeled Japanese.</p>
            <button id="set-language">Set English proofing language</button>
            <button id="set-east-asian-language">Set Japanese proofing language</button>
            <button id="set-other-language">Set non-East-Asian language</button>
            <button id="reset-language-detection">Reset language detection</button>
            <button id="detect-language">Detect English paragraph language</button>
            <button id="disable-proofing">Disable English paragraph proofing</button>
            <button id="reset-spelling">Reset spelling-checked flag</button>
            <button id="reset-grammar">Reset grammar-checked flag</button>
            <button id="get-proofing">Get language and proofing settings</button>
            <p>Get language and proofing settings reports both paragraphs' current values.
                Assigning languages or resetting flags may not visibly change the text.
                Resetting a flag doesn't itself run a spelling or grammar check or guarantee visible underlines.
                Word can update the flags during background proofing.</p>
        </section>
    language: html
