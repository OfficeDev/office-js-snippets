order: 1
id: word-formatting-border-properties
name: Border properties
description: Gets and sets individual properties of a border on a custom paragraph style.
host: WORD
api_set:
    WordApiDesktop: '1.1'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("set-color").addEventListener("click", () => tryCatch(setBorderColor));
        document.getElementById("set-type").addEventListener("click", () => tryCatch(setBorderType));
        document.getElementById("set-width").addEventListener("click", () => tryCatch(setBorderWidth));
        document.getElementById("get-location").addEventListener("click", () => tryCatch(getBorderLocation));
        document.getElementById("get-json").addEventListener("click", () => tryCatch(getBorderAsJson));
        document.getElementById("set-visibility").addEventListener("click", () => tryCatch(setBorderVisibility));

        async function setBorderColor() {
          // Sets the bottom border color to red.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);

            border.color = "red";
            await context.sync();
          });
        }

        async function setBorderType() {
          // Sets the bottom border type to a double line.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);

            border.type = Word.BorderType.double;
            await context.sync();
          });
        }

        async function setBorderWidth() {
          // Sets the bottom border width to 4.5 points.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);

            border.width = Word.BorderWidth.pt450;
            await context.sync();
          });
        }

        async function getBorderAsJson() {
          // Loads all scalar properties and returns them as a plain JavaScript object.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);
            border.load("color, location, type, visible, width");
            await context.sync();

            console.log("Border properties:", border.toJSON());
          });
        }

        async function getBorderLocation() {
          // Gets the location of the border in its border collection.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);
            border.load("location");
            await context.sync();

            console.log(`Border location: ${border.location}`);
          });
        }

        async function setBorderVisibility() {
          // Hides the bottom border.
          await Word.run(async (context) => {
            const style: Word.Style = context.document.getStyles().getByName("Bordered Text");
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);

            border.visible = false;
            await context.sync();
          });
        }

        async function setup() {
          // Creates a custom paragraph style and applies it to sample text.
          await Word.run(async (context) => {
            const styleName = "Bordered Text";
            let style: Word.Style = context.document.getStyles().getByNameOrNullObject(styleName);
            style.load("isNullObject");
            await context.sync();

            if (style.isNullObject) {
              style = context.document.addStyle(styleName, Word.StyleType.paragraph);
            }

            // Give the custom style a visible bottom border.
            const border: Word.Border = style.borders.getByLocation(Word.BorderLocation.bottom);
            border.type = Word.BorderType.single;
            border.visible = true;
            border.width = Word.BorderWidth.pt100;
            border.color = "blue";

            // Replace the document body with a paragraph that uses the custom style.
            const body: Word.Body = context.document.body;
            body.clear();
            const paragraph: Word.Paragraph = body.insertParagraph(
              "This paragraph uses a custom style with a bottom border.",
              Word.InsertLocation.start
            );
            paragraph.style = styleName;

            await context.sync();
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample gets and sets individual properties of a <code>Word.Border</code> object.</p>
            <p><b>Important:</b> These APIs are available in Word on Windows beginning with WordApiDesktop 1.1.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Create a custom paragraph style with a visible bottom border.</p>
            <button id="setup">Set up the sample</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="set-color">Set border color</button>
            <button id="set-type">Set border type</button>
            <button id="set-width">Set border width</button>
            <button id="get-location">Get border location</button>
            <button id="get-json">Get border as JSON</button>
            <button id="set-visibility">Hide border</button>
        </section>
    language: html
style:
    content: |-
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
        }

        section {
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        p {
            margin: 0 0 10px 0;
        }

        button {
            background-color: #f0f0f0;
            color: #333333;
            border: 1px solid #8a8a8a;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
            margin-left: 20px;
            margin-bottom: 5px;
            min-width: 80px;
            display: block;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active {
            background-color: #d0d0d0;
        }
    language: css
libraries: |-
    https://appsforoffice.microsoft.com/lib/1/hosted/office.js
    https://raw.githubusercontent.com/DefinitelyTyped/DefinitelyTyped/master/types/office-js/index.d.ts