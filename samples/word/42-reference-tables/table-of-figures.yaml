order: 3
id: word-reference-tables-table-of-figures
name: Basic table of figures
description: Creates a table of figures from entries in a sample document.
host: WORD
api_set:
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("mark-entries").addEventListener("click", () => tryCatch(markFigureEntries));
        document.getElementById("create-table-of-figures").addEventListener("click", () => tryCatch(createTableOfFigures));
        document.getElementById("get-properties").addEventListener("click", () => tryCatch(getTableOfFiguresProperties));
        document.getElementById("set-properties").addEventListener("click", () => tryCatch(setTableOfFiguresProperties));
        document.getElementById("update-page-numbers").addEventListener("click", () => tryCatch(updateTableOfFiguresPageNumbers));
        document.getElementById("delete-table").addEventListener("click", () => tryCatch(deleteTableOfFigures));

        async function markFigureEntries() {
            // Marks each figure paragraph as a table entry.
            await Word.run(async (context) => {
                const documentBody: Word.Body = context.document.body;
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                const paragraphs: Word.ParagraphCollection = documentBody.paragraphs;
                paragraphs.load("items/text");
                await context.sync();

                const figureParagraphs: Word.Paragraph[] = paragraphs.items.filter((paragraph: Word.Paragraph) =>
                    paragraph.text.startsWith("Figure ")
                );
                figureParagraphs.forEach((figureParagraph: Word.Paragraph) => {
                    const entryOptions: Word.TableOfContentsMarkEntryOptions = {
                        entry: figureParagraph.text,
                        level: 1,
                        tableId: "F",
                    };
                    const entryRange: Word.Range = figureParagraph.getRange();
                    tablesOfFigures.markTocEntry(entryRange, entryOptions);
                });
                await context.sync();

                console.log(`Marked ${figureParagraphs.length} table of figures entries.`);
            });
        }

        async function createTableOfFigures() {
            // Adds a table of figures at the start of the document.
            await Word.run(async (context) => {
                const documentBody: Word.Body = context.document.body;
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                const insertionRange: Word.Range = documentBody.getRange(Word.RangeLocation.start);
                const tableOptions: Word.TableOfFiguresAddOptions = {
                    captionLabel: "Figure",
                    includeLabel: true,
                    includePageNumbers: true,
                    rightAlignPageNumbers: true,
                    tableId: "F",
                    useFields: true,
                };
                const tableOfFigures: Word.TableOfFigures = tablesOfFigures.add(insertionRange, tableOptions);
                await context.sync();

                console.log("Created a table of figures.");
            });
        }

        async function getTableOfFiguresProperties() {
            // Gets and logs properties from the first table of figures.
            await Word.run(async (context) => {
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                tablesOfFigures.load("items");
                await context.sync();

                if (tablesOfFigures.items.length === 0) {
                    console.log("No table of figures found. Create one first.");
                    return;
                }

                const tableOfFigures: Word.TableOfFigures = tablesOfFigures.items[0];
                tableOfFigures.load(
                    "areFieldsUsed,arePageNumbersIncluded,arePageNumbersRightAligned,captionLabel,isLabelIncluded,range/text,tabLeader"
                );
                await context.sync();

                console.log("Table of figures:", tableOfFigures.range.text);
                console.log(`Caption label: ${tableOfFigures.captionLabel}`);
                console.log(`Uses TC fields: ${tableOfFigures.areFieldsUsed}`);
                console.log(`Includes label: ${tableOfFigures.isLabelIncluded}`);
                console.log(`Includes page numbers: ${tableOfFigures.arePageNumbersIncluded}`);
                console.log(`Right-aligned page numbers: ${tableOfFigures.arePageNumbersRightAligned}`);
                console.log(`Tab leader: ${tableOfFigures.tabLeader}`);
            });
        }

        async function setTableOfFiguresProperties() {
            // Changes the label and tab leader in the first table of figures.
            await Word.run(async (context) => {
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                tablesOfFigures.load("items");
                await context.sync();

                if (tablesOfFigures.items.length === 0) {
                    console.log("No table of figures found. Create one first.");
                    return;
                }

                const tableOfFigures: Word.TableOfFigures = tablesOfFigures.items[0];
                tableOfFigures.isLabelIncluded = false;
                tableOfFigures.tabLeader = Word.TabLeader.dashes;
                await context.sync();

                console.log("Updated the table of figures properties.");
            });
        }

        async function updateTableOfFiguresPageNumbers() {
            // Updates the page numbers in the first table of figures.
            await Word.run(async (context) => {
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                tablesOfFigures.load("items");
                await context.sync();

                if (tablesOfFigures.items.length === 0) {
                    console.log("No table of figures found. Create one first.");
                    return;
                }

                const tableOfFigures: Word.TableOfFigures = tablesOfFigures.items[0];
                tableOfFigures.updatePageNumbers();
                await context.sync();

                console.log("Updated the table of figures page numbers.");
            });
        }

        async function deleteTableOfFigures() {
            // Deletes the first table of figures.
            await Word.run(async (context) => {
                const tablesOfFigures: Word.TableOfFiguresCollection = context.document.tablesOfFigures;
                tablesOfFigures.load("items");
                await context.sync();

                if (tablesOfFigures.items.length === 0) {
                    console.log("No table of figures found.");
                    return;
                }

                const tableOfFigures: Word.TableOfFigures = tablesOfFigures.items[0];
                tableOfFigures.delete();
                await context.sync();

                console.log("Deleted the table of figures.");
            });
        }

        async function setup() {
            // Creates a report with two figure entries.
            await Word.run(async (context) => {
                const documentBody: Word.Body = context.document.body;
                documentBody.clear();

                const title: Word.Paragraph = documentBody.insertParagraph(
                    "Sample quarterly report",
                    Word.InsertLocation.end
                );
                title.styleBuiltIn = Word.BuiltInStyleName.title;

                documentBody.insertParagraph(
                    "Figure 1: Quarterly revenue",
                    Word.InsertLocation.end
                );
                documentBody.insertParagraph(
                    "The revenue chart compares results across four quarters.",
                    Word.InsertLocation.end
                );
                documentBody.insertParagraph(
                    "Figure 2: Regional growth",
                    Word.InsertLocation.end
                );
                documentBody.insertParagraph(
                    "The regional chart compares growth across three markets.",
                    Word.InsertLocation.end
                );
                await context.sync();

                console.log("Created a sample report with two figure entries.");
            });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample shows how to mark entries and create a table of figures.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Create sample report</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Word stores marked figure entries in hidden fields. Create the table to verify that the entries are marked.</p>
            <button id="mark-entries">Mark figure entries</button>
            <button id="create-table-of-figures">Create table of figures</button>
            <button id="get-properties">Get table properties</button>
            <button id="set-properties">Set table properties</button>
            <button id="update-page-numbers">Update page numbers</button>
            <button id="delete-table">Delete table</button>
        </section>
    language: html
