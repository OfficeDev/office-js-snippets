order: 4
id: word-ranges-inspect-and-adjust-range-boundaries-desktop
name: Inspect and adjust range boundaries (desktop)
description: Reads range positions and story information and selects text by adjusting its start or end boundary.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-position").addEventListener("click", () => tryCatch(getPosition));
        document.getElementById("move-start").addEventListener("click", () => tryCatch(moveStart));
        document.getElementById("move-end").addEventListener("click", () => tryCatch(moveEnd));

        async function getPosition() {
            // Reads the range's character positions and the story containing it.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.load("id,start,end,storyLength,storyType,isEndOfRowMark,isTextVisibleOnScreen");
                await context.sync();
                console.log("First paragraph's position and story:", {
                    id: paragraphRange.id,
                    start: paragraphRange.start,
                    end: paragraphRange.end,
                    storyLength: paragraphRange.storyLength,
                    storyType: paragraphRange.storyType,
                    isEndOfRowMark: paragraphRange.isEndOfRowMark,
                    isTextVisibleOnScreen: paragraphRange.isTextVisibleOnScreen
                });
            });
        }

        async function moveStart() {
            // Selects the first paragraph's text except its first character.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.load("start,end");
                await context.sync();
                if (paragraphRange.start === paragraphRange.end) {
                    console.warn("The paragraph is empty. Run Set up again.");
                    return;
                }
                paragraphRange.start = paragraphRange.start + 1;
                paragraphRange.select();
                await context.sync();
                console.log("Selected the range with its starting position advanced by one character.");
            });
        }

        async function moveEnd() {
            // Selects the first paragraph's text except its last character.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                paragraphRange.load("start,end");
                await context.sync();
                if (paragraphRange.start === paragraphRange.end) {
                    console.warn("The paragraph is empty. Run Set up again.");
                    return;
                }
                paragraphRange.end = paragraphRange.end - 1;
                paragraphRange.select();
                await context.sync();
                console.log("Selected the range with its ending position reduced by one character.");
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.insertText("Project summary: the team is ready for review.", Word.InsertLocation.replace);
                await context.sync();
                console.log("Created the sample paragraph for range-boundary inspection and selection.");
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>This sample demonstrates how to inspect a paragraph range's character positions and story information,
            then select part of its text by adjusting a range boundary.</section>
        <section>
            <p><b>Support:</b> Requires WordApiDesktop 1.4 on Windows or Mac.
            These APIs aren't available in Word on the web.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with an English summary.</p>
            <button id="setup">Set up</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-position">Get positions and story information</button>
            <button id="move-start">Select without first character</button>
            <button id="move-end">Select without last character</button>
            <p>The selection actions don't change the document text. Each starts from the full paragraph,
                not the previous selection. <b>Get positions and story information</b> always inspects the full paragraph range.</p>
        </section>
    language: html
