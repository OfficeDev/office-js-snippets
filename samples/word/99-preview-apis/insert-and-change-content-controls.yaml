order: 1
id: word-insert-and-change-content-controls
name: Content control states (preview)
description: Sets warning and error states on a sample content control and resets its state.
author: OfficeDev
host: WORD
api_set:
    WordApi: preview
script:
    content: |
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("set-warning-state").addEventListener("click", () => tryCatch(setWarningState));
        document.getElementById("set-error-state").addEventListener("click", () => tryCatch(setErrorState));
        document.getElementById("reset-state").addEventListener("click", () => tryCatch(resetState));

        async function setWarningState() {
            // Marks the sample content control with a warning.
            await Word.run(async (context) => {
                const sampleControl: Word.ContentControl = context.document.contentControls
                    .getByTag("ContentControlStateSample").getFirstOrNullObject();
                await context.sync();

                if (sampleControl.isNullObject) {
                    console.warn("Run Set up to create the sample content control.");
                    return;
                }

                const state: Word.ContentControlState = Word.ContentControlState.warning;
                sampleControl.setState(state);
                await context.sync();
                console.log(`Set sample content control state to ${state}.`);
            });
        }

        async function setErrorState() {
            // Marks the sample content control with an error.
            await Word.run(async (context) => {
                const sampleControl: Word.ContentControl = context.document.contentControls
                    .getByTag("ContentControlStateSample").getFirstOrNullObject();
                await context.sync();

                if (sampleControl.isNullObject) {
                    console.warn("Run Set up to create the sample content control.");
                    return;
                }

                const state: Word.ContentControlState = Word.ContentControlState.error;
                sampleControl.setState(state);
                await context.sync();
                console.log(`Set sample content control state to ${state}.`);
            });
        }

        async function resetState() {
            // Clears the sample content control's warning or error state without deleting its text.
            await Word.run(async (context) => {
                const sampleControl: Word.ContentControl = context.document.contentControls
                    .getByTag("ContentControlStateSample").getFirstOrNullObject();
                await context.sync();

                if (sampleControl.isNullObject) {
                    console.warn("Run Set up to create the sample content control.");
                    return;
                }

                sampleControl.resetState();
                await context.sync();
                console.log("Reset the sample content control state.");
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.clear();
                const sampleParagraph: Word.Paragraph = body.insertParagraph(
                    "Project code: pending review.", Word.InsertLocation.start
                );
                const sampleControl: Word.ContentControl = sampleParagraph
                    .getRange(Word.RangeLocation.content).insertContentControl();
                sampleControl.tag = "ContentControlStateSample";
                sampleControl.title = "Project code";
                sampleControl.select();
                await context.sync();
                console.log("Created and selected the sample content control.");
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample shows how to flag a project code with a warning or error and reset the content control's state.</p>
            <p><b>Support:</b> Content control state APIs are in preview and aren't supported on all Word clients.
                They aren't intended for production use.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Set up replaces the document body with one sample content control and selects it.
                Run it again to restore the starting content.</p>
            <button id="setup">Create sample content control</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Compare the sample control's appearance after setting each state.
                The console reports completed actions or errors from Word.</p>
            <button id="set-warning-state">Set warning state</button>
            <button id="set-error-state">Set error state</button>
            <p>Reset clears the warning or error state without deleting the control or its text.</p>
            <button id="reset-state">Reset state</button>
        </section>
    language: html
