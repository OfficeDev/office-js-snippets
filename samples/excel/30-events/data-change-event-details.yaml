order: 6
id: excel-data-change-event-details
name: Data changed event details
description: Inspect a table cell's values and basic types before and after an edit, and identify error values.
host: EXCEL
api_set:
    ExcelApi: '1.9'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("register-handler").addEventListener("click", () => tryCatch(registerChangeEventHandler));

        async function registerChangeEventHandler() {
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const expensesTable: Excel.Table = sheet.tables.getItem("ExpensesTable");

                // This event fires when a user edits a cell in the table.
                expensesTable.onChanged.add(onTableChanged);
                await context.sync();

                console.log("Added onChanged handler");
            });
        }

        async function onTableChanged(eventArgs: Excel.TableChangedEventArgs) {
            // Inspect the values and basic types of an edited table cell, and identify errors.
            await Excel.run(async (context) => {
                const details: Excel.ChangedEventDetail = eventArgs.details;
                const address = eventArgs.address;
                if (!details) {
                    console.log("Edit one table cell at a time to inspect its value and type.");
                    return;
                }

                console.log(`Change at ${address}: was ${details.valueBefore}(${details.valueTypeBefore}),`
                  + ` now is ${details.valueAfter}(${details.valueTypeAfter})`);

                const errorType: Excel.RangeValueType = Excel.RangeValueType.error;
                if (details.valueTypeAfter === errorType) {
                    console.log("The updated cell contains an error:", details.valueAfter);
                }
            });
        }

        async function setup() {
            await Excel.run(async (context) => {
                context.workbook.worksheets.getItemOrNullObject("Sample").delete();
                const sheet = context.workbook.worksheets.add("Sample");

                const expensesTable = sheet.tables.add("A1:D1", true /*hasHeaders*/);
                expensesTable.name = "ExpensesTable";

                expensesTable.getHeaderRowRange().values = [["Date", "Merchant", "Category", "Amount"]];

                expensesTable.rows.add(null /*add at the end*/, [
                    ["4/1/2017", "The Phone Company", "Communications", "$120"],
                    ["4/2/2017", "Northwind Electric Cars", "Transportation", "$142"],
                    ["4/5/2017", "Best For You Organics Company", "Groceries", "$27"],
                    ["4/10/2017", "Coho Vineyard", "Restaurant", "$33"],
                    ["4/11/2017", "Bellows College", "Education", "$350"],
                    ["4/15/2017", "Trey Research", "Other", "$135"],
                    ["4/15/2017", "Best For You Organics Company", "Groceries", "$97"]
                ]);

                sheet.getUsedRange().format.autofitColumns();
                sheet.activate();
                await context.sync();
            });
        }

        /** Default helper for invoking an action and handling errors. */
        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
          <p>Inspect a table cell's values and basic types before and after an edit, and identify error values.</p>
        </section>
        <section>
          <h3>Set up</h3>
          <button id="setup">Set up</button>
        </section>
        <section>
          <h3>Try it out</h3>
          <button id="register-handler">Register data change handler</button>
          <p>After registering the handler, edit one cell at a time in ExpensesTable on the Sample worksheet. Replace a merchant name with a number to see its basic type change from String to a numeric type in the console.</p>
          <p>Enter =1/0 in a table cell to produce a #DIV/0! error. The handler compares the new basic type with Excel.RangeValueType.error and logs an additional error message.</p>
        </section>
    language: html
