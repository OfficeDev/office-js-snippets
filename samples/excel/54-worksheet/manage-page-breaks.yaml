order: 10
id: excel-worksheet-manage-page-breaks
name: Manage page breaks
description: Adds, inspects, and removes horizontal and vertical page breaks.
author: OfficeDev
host: EXCEL
api_set:
    ExcelApi: '1.9'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("add-page-breaks").addEventListener("click", () => tryCatch(addPageBreaks));
        document.getElementById("list-page-breaks").addEventListener("click", () => tryCatch(listPageBreaks));
        document.getElementById("count-page-breaks").addEventListener("click", () => tryCatch(countPageBreaks));
        document.getElementById("get-first-page-break").addEventListener("click", () => tryCatch(getFirstPageBreak));
        document.getElementById("delete-first-page-break").addEventListener("click", () => tryCatch(deleteFirstPageBreak));
        document.getElementById("remove-page-breaks").addEventListener("click", () => tryCatch(removePageBreaks));

        async function addPageBreaks() {
            // Add horizontal and vertical breaks before the specified cells.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const verticalBreaks: Excel.PageBreakCollection = sheet.verticalPageBreaks;

                horizontalBreaks.add("A12");
                horizontalBreaks.add("A22");
                const columnBoundary: Excel.Range = sheet.getRange("E1");
                verticalBreaks.add(columnBoundary);

                await context.sync();
                console.log("Added horizontal breaks before rows 12 and 22, and a vertical break before column E.");
            });
        }

        async function listPageBreaks() {
            // Load and inspect the page breaks in both worksheet collections.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const verticalBreaks: Excel.PageBreakCollection = sheet.verticalPageBreaks;
                horizontalBreaks.load("items/rowIndex, items/columnIndex");
                verticalBreaks.load("items/rowIndex, items/columnIndex");

                await context.sync();
                console.log(`Horizontal page breaks: ${horizontalBreaks.items.length}`);
                horizontalBreaks.items.forEach((pageBreak: Excel.PageBreak) => {
                    console.log("Horizontal break (zero-based indexes):", {
                        rowIndex: pageBreak.rowIndex,
                        columnIndex: pageBreak.columnIndex
                    });
                });
                console.log(`Vertical page breaks: ${verticalBreaks.items.length}`);
                verticalBreaks.items.forEach((pageBreak: Excel.PageBreak) => {
                    console.log("Vertical break (zero-based indexes):", {
                        rowIndex: pageBreak.rowIndex,
                        columnIndex: pageBreak.columnIndex
                    });
                });
            });
        }

        async function countPageBreaks() {
            // Count page breaks without loading the collection's items.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const verticalBreaks: Excel.PageBreakCollection = sheet.verticalPageBreaks;
                const horizontalCount: OfficeExtension.ClientResult<number> = horizontalBreaks.getCount();
                const verticalCount: OfficeExtension.ClientResult<number> = verticalBreaks.getCount();

                await context.sync();
                console.log(`Horizontal page breaks: ${horizontalCount.value}`);
                console.log(`Vertical page breaks: ${verticalCount.value}`);
            });
        }

        async function getFirstPageBreak() {
            // Inspect the first horizontal break and locate the cell immediately after it.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const horizontalCount: OfficeExtension.ClientResult<number> = horizontalBreaks.getCount();
                await context.sync();

                if (horizontalCount.value === 0) {
                    console.warn("No horizontal page breaks. Choose Add page breaks first.");
                    return;
                }

                const firstBreak: Excel.PageBreak = horizontalBreaks.getItem(0);
                const cellAfterBreak: Excel.Range = firstBreak.getCellAfterBreak();
                firstBreak.load("rowIndex, columnIndex");
                cellAfterBreak.load("address");

                await context.sync();
                console.log("First horizontal page break (zero-based indexes):", {
                    rowIndex: firstBreak.rowIndex,
                    columnIndex: firstBreak.columnIndex,
                    cellAfterBreak: cellAfterBreak.address
                });
            });
        }

        async function deleteFirstPageBreak() {
            // Delete a single horizontal break while leaving the other breaks unchanged.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const horizontalCount: OfficeExtension.ClientResult<number> = horizontalBreaks.getCount();
                await context.sync();

                if (horizontalCount.value === 0) {
                    console.warn("No horizontal page breaks. Choose Add page breaks first.");
                    return;
                }

                const firstBreak: Excel.PageBreak = horizontalBreaks.getItem(0);
                firstBreak.delete();
                await context.sync();
                console.log("Deleted the first horizontal page break. Choose List page breaks to inspect the remaining breaks.");
            });
        }

        async function removePageBreaks() {
            // Reset all manual page breaks in both worksheet collections.
            await Excel.run(async (context) => {
                const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
                const horizontalBreaks: Excel.PageBreakCollection = sheet.horizontalPageBreaks;
                const verticalBreaks: Excel.PageBreakCollection = sheet.verticalPageBreaks;
                horizontalBreaks.removePageBreaks();
                verticalBreaks.removePageBreaks();

                await context.sync();
                console.log("Removed all manual page breaks. Choose Count page breaks to verify the collections.");
            });
        }

        async function setup() {
            await Excel.run(async (context) => {
                context.workbook.worksheets.getItemOrNullObject("Sample").delete();
                const sheet: Excel.Worksheet = context.workbook.worksheets.add("Sample");
                const salesData: (string | number)[][] = [
                    ["Product", "Region", "Q1", "Q2", "Q3", "Q4", "Total", "Target"]
                ];
                for (let index = 1; index <= 40; index++) {
                    const quarterlySales = 100 + index * 10;
                    salesData.push([
                        `Product ${index}`, index % 2 === 0 ? "North" : "South",
                        quarterlySales, quarterlySales, quarterlySales, quarterlySales,
                        quarterlySales * 4, 2000
                    ]);
                }

                const dataRange: Excel.Range = sheet.getRange("A1:H41");
                dataRange.values = salesData;
                dataRange.format.columnWidth = 65;
                dataRange.format.rowHeight = 18;
                sheet.getRange("A1:H1").format.font.bold = true;
                sheet.pageLayout.setPrintArea("A1:H41");
                sheet.pageLayout.zoom = { scale: 100 };
                sheet.activate();

                await context.sync();
                console.log("Created sales data on Sample with no manual page breaks.");
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample demonstrates horizontal and vertical page-break collections for a sales worksheet.</p>
            <p>Requires ExcelApi 1.9. Set up replaces the worksheet named <b>Sample</b>.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Create sales worksheet</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Add breaks, then inspect their counts, zero-based indexes, and the cell after the first horizontal break in the console.</p>
            <button id="add-page-breaks">Add page breaks</button>
            <button id="list-page-breaks">List page breaks</button>
            <button id="count-page-breaks">Count page breaks</button>
            <button id="get-first-page-break">Get first horizontal break</button>
            <button id="delete-first-page-break">Delete first horizontal break</button>
            <button id="remove-page-breaks">Remove all manual breaks</button>
            <p>After a deletion or reset, list or count the breaks again. Add page breaks restores the sample boundaries.</p>
            <p>Page breaks affect printing, so the normal worksheet view might not visibly change. In desktop Excel, <b>View</b> &gt; <b>Page Break Preview</b> shows the boundaries. <b>File</b> &gt; <b>Print</b> shows pagination. Automatic breaks depend on paper and printer settings and aren't removed by resetting manual breaks.</p>
        </section>
    language: html
