order: 2
id: word-images-insert-and-inspect-floating-pictures-desktop
name: Insert and inspect floating pictures (desktop)
description: Inserts a floating picture and reads shapes anchored in the sample paragraph.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.2'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("insert-picture").addEventListener("click", () => tryCatch(insertPicture));
        document.getElementById("get-shapes").addEventListener("click", () => tryCatch(getShapes));

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                const shapes: Word.ShapeCollection = body.shapes;
                shapes.load("items");
                await context.sync();
                shapes.items.forEach((shape: Word.Shape) => shape.delete());
                body.insertText("Project summary: floating pictures are anchored to this paragraph.", Word.InsertLocation.replace);
                await context.sync();
                console.log("Created the sample paragraph. Insert a floating picture, then get anchored shapes.");
            });
        }

        async function insertPicture() {
            // Anchors a floating picture at the start of the first paragraph.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const pictureOptions: Word.InsertShapeOptions = { left: 20, top: 20, width: 90, height: 39 };
                const picture: Word.Shape = paragraphRange.insertPictureFromBase64(
                    "",
                    pictureOptions
                );
                picture.name = "FloatingPictureSample";
                await context.sync();
                console.log("Inserted a floating picture anchored to the first paragraph. Get anchored shapes to inspect it.");
            });
        }

        async function getShapes() {
            // Reads shapes anchored within the first paragraph range.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange();
                const shapes: Word.ShapeCollection = paragraphRange.shapes;
                shapes.load("items/name,items/type,items/width,items/height");
                await context.sync();
                console.log(`Shapes anchored in the first paragraph: ${shapes.items.length}`);
                shapes.items.forEach((shape: Word.Shape) => {
                    console.log("Anchored shape:", { name: shape.name, type: shape.type, width: shape.width, height: shape.height });
                });
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample demonstrates how to insert a floating picture and inspect shapes anchored in a paragraph.</p>
            <p><b>Support:</b> Requires WordApiDesktop 1.2 in Word on Windows or Mac,
                not Word on the web.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body and removes its anchored shapes, creating a sample anchor paragraph.
                <b>Set up</b> resets the sample, removing previously inserted pictures.</p>
            <button id="setup">Set up</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="insert-picture">Insert floating picture</button>
            <button id="get-shapes">Get anchored shapes</button>
            <p>The picture floats in front of text rather than becoming an inline character.
                Its anchor is at the beginning of the first paragraph.</p>
            <p><b>Get anchored shapes</b> reports the name, type, width, and height of each shape in that paragraph.
                Before a picture is inserted, the count is zero. Each insertion adds another picture at the same position,
                so multiple pictures can overlap.</p>
        </section>
    language: html
