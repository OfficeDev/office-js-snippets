order: 1
id: word-document-manage-bindings
name: Manage a selection binding
description: Creates and manages a text binding from the current selection in Word using the Common APIs.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.1'
script:
    content: |-
        const bindingId = "word-selection-binding";

        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("add-binding").addEventListener("click", addBindingFromSelection);
        document.getElementById("read-binding").addEventListener("click", readBinding);
        document.getElementById("write-binding").addEventListener("click", writeBinding);
        document.getElementById("get-all-bindings").addEventListener("click", getAllBindings);
        document.getElementById("release-binding").addEventListener("click", releaseBinding);

        function addBindingFromSelection() {
            // Creates a text binding from the current selection.
            const options: Office.AddBindingFromSelectionOptions = { id: bindingId };
            Office.context.document.bindings.addFromSelectionAsync(
                Office.BindingType.Text,
                options,
                (asyncResult) => {
                    if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                        console.error(asyncResult.error.message);
                        return;
                    }

                    console.log(`Created binding "${asyncResult.value.id}" of type "${asyncResult.value.type}".`);
                }
            );
        }

        function readBinding() {
            // Gets the binding by ID and reads its text.
            Office.context.document.bindings.getByIdAsync(bindingId, (bindingResult) => {
                if (bindingResult.status === Office.AsyncResultStatus.Failed) {
                    console.error(bindingResult.error.message);
                    return;
                }

                bindingResult.value.getDataAsync<string>(
                    { coercionType: Office.CoercionType.Text },
                    (dataResult) => {
                        if (dataResult.status === Office.AsyncResultStatus.Failed) {
                            console.error(dataResult.error.message);
                            return;
                        }

                        console.log(`The bound text is "${dataResult.value}".`);
                    }
                );
            });
        }

        function writeBinding() {
            // Gets the binding by ID and replaces its text.
            const text = (document.getElementById("binding-text") as HTMLInputElement).value;

            Office.context.document.bindings.getByIdAsync(bindingId, (bindingResult) => {
                if (bindingResult.status === Office.AsyncResultStatus.Failed) {
                    console.error(bindingResult.error.message);
                    return;
                }

                bindingResult.value.setDataAsync(
                    text,
                    { coercionType: Office.CoercionType.Text },
                    (dataResult) => {
                        if (dataResult.status === Office.AsyncResultStatus.Failed) {
                            console.error(dataResult.error.message);
                            return;
                        }

                        console.log("Replaced the bound text.");
                    }
                );
            });
        }

        function getAllBindings() {
            // Gets all bindings in the document.
            Office.context.document.bindings.getAllAsync((asyncResult) => {
                if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                    console.error(asyncResult.error.message);
                    return;
                }

                if (asyncResult.value.length === 0) {
                    console.log("There are no bindings in this document.");
                    return;
                }

                console.log("Bindings in this document:");
                asyncResult.value.forEach((binding) => {
                    console.log(`- ID: "${binding.id}", type: "${binding.type}"`);
                });
            });
        }

        function releaseBinding() {
            // Removes the binding with the specified ID from the document.
            Office.context.document.bindings.releaseByIdAsync(bindingId, (asyncResult) => {
                if (asyncResult.status === Office.AsyncResultStatus.Failed) {
                    console.error(asyncResult.error.message);
                    return;
                }

                console.log(`Released binding "${bindingId}".`);
            });
        }

        async function setup() {
            // Clears the document, inserts sample text, and selects the text.
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.clear();
                const sampleText = body.insertParagraph(
                    "This sample text can be accessed through a binding.",
                    Word.InsertLocation.start
                );
                sampleText.select();
                await context.sync();
            });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample creates and manages a text binding from the current selection with the common Office JavaScript API.</p>
        </section>
        <section>
            <h3>Set up</h3>
            <p>Insert sample text into the document and select it.</p>
            <button id="setup">Set up</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Create a binding to the selected text.</p>
            <button id="add-binding">Create binding from selection</button>
            <p>Read the text in the binding.</p>
            <button id="read-binding">Read bound text</button>
            <p>Replace the text in the binding.</p>
            <input id="binding-text" type="text" value="Text written through the binding.">
            <button id="write-binding">Replace bound text</button>
            <p>List all bindings created by this add-in in the document.</p>
            <button id="get-all-bindings">Get all bindings</button>
            <p>Release the binding when you're finished.</p>
            <button id="release-binding">Release binding</button>
        </section>
    language: html
style:
    content: |-
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
        }

        section {
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        p {
            margin: 0 0 10px 0;
        }

        button {
            background-color: #f0f0f0;
