order: 13
id: word-paragraph-add-border-to-paragraph
name: Add a border to a paragraph
description: Adds a double line border to a paragraph in the document.
host: WORD
api_set:
    WordApiDesktop: '1.3'
script:
    content: |
        document.getElementById("run").addEventListener("click", () => tryCatch(run));

        async function run() {
          if (!Office.context.requirements.isSetSupported("WordApiDesktop", "1.3")) {
            console.error("This sample requires WordApiDesktop 1.3 or later.");
            return;
          }

          await Word.run(async (context) => {
            const paragraph: Word.Paragraph =
              context.document.body.insertParagraph(
                "Note: Added a border to this paragraph.",
                Word.InsertLocation.start
              );

            const borders: Word.BorderUniversalCollection = paragraph.borders;
            borders.load("items");
            await context.sync();

            borders.items.forEach((border: Word.BorderUniversal) => {
              border.isVisible = true;
              border.color = "#4472C4";
              border.lineStyle = Word.BorderLineStyle.double;
              border.lineWidth = Word.LineWidth.pt150;
            });

            await context.sync();

            console.log(
              `Applied the ${Word.BorderLineStyle.double} line style to ${borders.items.length} paragraph borders.`
            );
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section class="ms-font-m">
            <p>Insert a paragraph and apply double-line borders.</p>
            <button id="run">Apply paragraph borders</button>
        </section>
    language: html
