order: 9
id: excel-table-manage-table-rows
name: Manage table rows
description: Adds, gets, and deletes rows in a table.
author: OfficeDev
host: EXCEL
api_set:
    ExcelApi: '1.4'
    ExcelApiOnline: '1.1'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("add-rows").addEventListener("click", () => tryCatch(addRows));
        document.getElementById("get-row-count").addEventListener("click", () => tryCatch(getRowCount));
        document.getElementById("get-first-row").addEventListener("click", () => tryCatch(getFirstRow));
        document.getElementById("delete-rows").addEventListener("click", () => tryCatch(deleteRows));

        async function addRows() {
            // Add two rows to the end of the table.
            await Excel.run(async (context) => {
                const salesTable: Excel.Table = context.workbook.worksheets
                    .getItem("Sample")
                    .tables.getItem("SalesTable");
                const tableRows: Excel.TableRowCollection = salesTable.rows;

                tableRows.add(null, [
                    ["Zoran Dimovski", "North", 1200],
                    ["Immanuel Vogel", "South", 950]
                ]);

                await context.sync();
                console.log("Added two rows to SalesTable.");
            });
        }

        async function getRowCount() {
            // Get the number of data rows in the table.
            await Excel.run(async (context) => {
                const salesTable: Excel.Table = context.workbook.worksheets
                    .getItem("Sample")
                    .tables.getItem("SalesTable");
                const tableRows: Excel.TableRowCollection = salesTable.rows;
                const rowCount: OfficeExtension.ClientResult<number> = tableRows.getCount();

                await context.sync();
                console.log(`SalesTable contains ${rowCount.value} data rows.`);
            });
        }

        async function getFirstRow() {
            // Get the first row in the collection and read its values.
            await Excel.run(async (context) => {
                const salesTable: Excel.Table = context.workbook.worksheets
                    .getItem("Sample")
                    .tables.getItem("SalesTable");
                const tableRows: Excel.TableRowCollection = salesTable.rows;
                const firstRow: Excel.TableRow = tableRows.getItemAt(0);
                firstRow.load("index, values");

                await context.sync();
                console.log(`Row ${firstRow.index} values: ${JSON.stringify(firstRow.values)}`);
            });
        }

        async function deleteRows() {
            // Delete the second and fourth data rows from the table.
            await Excel.run(async (context) => {
                const salesTable: Excel.Table = context.workbook.worksheets
                    .getItem("Sample")
                    .tables.getItem("SalesTable");
                const tableRows: Excel.TableRowCollection = salesTable.rows;

                tableRows.deleteRows([1, 3]);

                await context.sync();
                console.log("Deleted the second and fourth data rows from SalesTable.");
            });
        }

        async function setup() {
            await Excel.run(async (context) => {
                context.workbook.worksheets.getItemOrNullObject("Sample").delete();
                const sheet: Excel.Worksheet = context.workbook.worksheets.add("Sample");
                const sampleData: (string | number)[][] = [
                    ["Salesperson", "Region", "Sales"],
                    ["Pau Pons", "North", 1400],
                    ["Mumo Cherono", "West", 1150],
                    ["Sven Schrijer", "East", 1250],
                    ["Farrukh Huseynov", "South", 1000]
                ];

                const dataRange: Excel.Range = sheet.getRange("A1:C5");
                dataRange.values = sampleData;

                const salesTable: Excel.Table = sheet.tables.add(dataRange, true);
                salesTable.name = "SalesTable";
                sheet.getUsedRange().format.autofitColumns();
                sheet.activate();

                await context.sync();
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample shows how to work with the rows collection of an Excel table.</p>
            <p><b>Note:</b> Deleting multiple rows with <code>deleteRows</code> requires Excel on the web.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <button id="setup">Create sales table</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="add-rows">Add rows</button>
            <button id="get-row-count">Get row count</button>
            <button id="get-first-row">Get first row</button>
            <button id="delete-rows">Delete rows</button>
        </section>
    language: html
