order: 5
id: word-ranges-inspect-range-layout-desktop
name: Inspect range layout (desktop)
description: Inspects sections, frames, and hyperlinks in a document range.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.3'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-sections").addEventListener("click", () => tryCatch(getSections));
        document.getElementById("get-frames").addEventListener("click", () => tryCatch(getFrames));
        document.getElementById("get-hyperlinks").addEventListener("click", () => tryCatch(getHyperlinks));

        async function getSections() {
            // Reads the text of sections intersecting the document body range.
            await Word.run(async (context) => {
                const bodyRange: Word.Range = context.document.body.getRange();
                const sections: Word.SectionCollection = bodyRange.sections;
                sections.load("items/body/text");
                await context.sync();
                console.log(`Sections found: ${sections.items.length}`);
                sections.items.forEach((section: Word.Section) => console.log(section.body.text));
            });
        }

        async function getFrames() {
            // Reads the text and dimensions of frames in the document body range.
            await Word.run(async (context) => {
                const bodyRange: Word.Range = context.document.body.getRange();
                const frames: Word.FrameCollection = bodyRange.frames;
                frames.load("items/width,items/height,items/range/text");
                await context.sync();
                console.log(`Frames found: ${frames.items.length}`);
                frames.items.forEach((frame: Word.Frame) => {
                    console.log({ width: frame.width, height: frame.height, text: frame.range.text });
                });
            });
        }

        async function getHyperlinks() {
            // Reads hyperlink objects and their destinations in the document body range.
            await Word.run(async (context) => {
                const bodyRange: Word.Range = context.document.body.getRange();
                const hyperlinks: Word.HyperlinkCollection = bodyRange.hyperlinks;
                hyperlinks.load("items/address,items/range/text");
                await context.sync();
                console.log(`Hyperlinks found: ${hyperlinks.items.length}`);
                hyperlinks.items.forEach((hyperlink: Word.Hyperlink) => {
                    console.log({ address: hyperlink.address, text: hyperlink.range.text });
                });
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.clear();
                const summary: Word.Paragraph = body.insertParagraph("Project summary", Word.InsertLocation.start);
                summary.getRange(Word.RangeLocation.content).hyperlink = "https://learn.microsoft.com/office/dev/add-ins/word/";
                const frameParagraph: Word.Paragraph = body.insertParagraph("Framed project note.", Word.InsertLocation.end);
                const frameRange: Word.Range = frameParagraph.getRange();
                const frame: Word.Frame = body.getRange().frames.add(frameRange);
                frame.width = 200;
                body.insertParagraph("Additional project details.", Word.InsertLocation.end);
                await context.sync();
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>This sample shows how to inspect the sections, frames, and hyperlinks in a report.</section>
        <section><p><b>Support:</b> Requires WordApiDesktop 1.3 on Windows or Mac.</p></section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with sample text, a hyperlink, and a frame.</p>
            <button id="setup">Create sample report</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-sections">Get sections</button>
            <button id="get-frames">Get frames</button>
            <button id="get-hyperlinks">Get hyperlink objects</button>
        </section>
    language: html
