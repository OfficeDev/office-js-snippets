id: word-export
name: Export document
description: Shows how to export the current document as a PDF, including bookmarks created from headings or named Word bookmarks.
host: WORD
api_set:
    WordApiDesktop: '1.6'
script:
    content: |
        document.getElementById("export-pdf").addEventListener("click", () => tryCatch(exportAsPdf));
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));

        async function exportAsPdf() {
          await Word.run(async (context) => {
            // Choose whether the exported PDF uses Word headings, named bookmarks, or neither.
            const bookmarkMode = (document.getElementById("bookmark-mode") as HTMLSelectElement).value;
            let createBookmarks: Word.ExportCreateBookmarks;

            switch (bookmarkMode) {
              case "Headings":
                createBookmarks = Word.ExportCreateBookmarks.headings;
                break;
              case "WordBookmarks":
                createBookmarks = Word.ExportCreateBookmarks.wordBookmarks;
                break;
              default:
                createBookmarks = Word.ExportCreateBookmarks.none;
                break;
            }

            // Export the current document as a PDF saved in your default location, usually Documents.
            const filename = `exported-doc-${bookmarkMode}-${getCurrentDate()}.pdf`;
            console.log(`File name: ${filename}`);
            const options: Word.DocumentExportAsFixedFormatOptions = {
              item: Word.ExportItem.documentContent,
              openAfterExport: true,
              optimizeFor: Word.ExportOptimizeFor.onScreen,
              createBookmarks: createBookmarks,
            };

            // If a file with the same name already exists at the default location, it's silently overwritten.
            context.document.exportAsFixedFormat(filename, Word.ExportFormat.pdf, options);

            await context.sync();
          });
        }

        function getCurrentDate() {
          const today = new Date();
          const day = String(today.getDate()).padStart(2, "0");
          const month = String(today.getMonth() + 1).padStart(2, "0");
          const year = today.getFullYear();

          return `${year}-${month}-${day}`;
        }

        async function setup() {
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.clear();

            // Apply built-in heading styles so the Headings export mode can create PDF bookmarks.
            const title: Word.Paragraph = body.insertParagraph("Extend Word with Office Add-ins", Word.InsertLocation.end);
            title.styleBuiltIn = Word.BuiltInStyleName.heading1;

            const overview: Word.Paragraph = body.insertParagraph(
              "Do you want to create a solution that extends the functionality of Word? You can use the Office Add-ins platform to extend Word clients running on the web, on a Windows desktop, or on a Mac.",
              Word.InsertLocation.end,
            );
            overview.styleBuiltIn = Word.BuiltInStyleName.normal;

            const detailsHeading: Word.Paragraph = body.insertParagraph("How Word add-ins work", Word.InsertLocation.end);
            detailsHeading.styleBuiltIn = Word.BuiltInStyleName.heading2;
            const details: Word.Paragraph = body.insertParagraph(
              "Use add-in commands to extend the Word UI. Launch task panes that run JavaScript to interact with the content in a Word document. Any code that you can run in a browser can run in a Word add-in. Add-ins that interact with content in a Word document create requests to act on Word objects and synchronize object state.",
              Word.InsertLocation.end,
            );
            details.styleBuiltIn = Word.BuiltInStyleName.normal;

            // Add a named Word bookmark that the WordBookmarks export mode can include in the PDF.
            details.getRange(Word.RangeLocation.whole).insertBookmark("named_bookmark");

            await context.sync();
            console.log("Sample document created with headings and bookmark 'named_bookmark'.");
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>This sample exports the current document to PDF and demonstrates how to include bookmarks in the PDF's table of contents.</p>
            <p>Choose <b>None</b> for no bookmarks, <b>Headings</b> for bookmarks from heading paragraphs, or <b>WordBookmarks</b> for bookmarks from named Word bookmarks.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Create sample content with headings and a Word bookmark named <code>named_bookmark</code>.</p>
            <button id="setup">Create sample document content</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <label for="bookmark-mode">Bookmark mode:</label>
            <select id="bookmark-mode">
                <option>None</option>
                <option>Headings</option>
                <option>Word Bookmarks</option>
            </select>
            <button id="export-pdf">Export to PDF</button>
        </section>
    language: html
style:
    content: |-
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            padding: 10px;
        }

        section {
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
        }

        p {
            margin: 0 0 10px 0;
        }

        button {
            background-color: #f0f0f0;
            color: #333333;
            border: 1px solid #8a8a8a;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
            margin-left: 20px;
            margin-bottom: 5px;
            min-width: 80px;
            display: block;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:active {
            background-color: #d0d0d0;
        }

        input {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 2px;
            font-size: 14px;
        }

        label,
        select {
          display: block;
          margin-left: 20px;
        }

        select {
          margin-bottom: 8px;
          padding: 4px;
        }

        .header {
            text-align: center;
            background-color: #f3f2f1;
            padding: 10px;
        }
    language: css
libraries: |-
    https://appsforoffice.microsoft.com/lib/beta/hosted/office.js
    https://raw.githubusercontent.com/DefinitelyTyped/DefinitelyTyped/master/types/office-js-preview/index.d.ts