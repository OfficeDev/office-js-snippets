order: 8
id: excel-data-types-error-values
name: 'Data types: Set and change error values'
description: Set and replace a busy error, and inspect a cell's value type with conditional handling for unavailable types.
host: EXCEL
api_set:
    ExcelApi: '1.16'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("set-busy-error").addEventListener("click", () => tryCatch(setBusyError));
        document.getElementById("change-busy-error").addEventListener("click", () => tryCatch(changeBusyError));
        document.getElementById("inspect-unavailable-value").addEventListener("click", () => tryCatch(inspectUnavailableValue));

        async function setBusyError() {
          // This function sets the value of cell A1 to a #BUSY! error using data types.
          await Excel.run(async (context) => {
            // Retrieve the Sample worksheet and cell A1 on that sheet.
            const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
            const range: Excel.Range = sheet.getRange("A1");

            // Get the error data type and set its type to `busy`.
            const valueType: Excel.CellValueType = Excel.CellValueType.error;
            const errorType: Excel.ErrorCellValueType = Excel.ErrorCellValueType.busy;
            const error: Excel.ErrorCellValue = {
              type: valueType,
              errorType: errorType
            };

            // Set cell A1 as the busy error.
            range.valuesAsJson = [[error]];
            await context.sync();
          });
        }

        async function changeBusyError() {
          // Replace the busy error in A1 without changing the value in B1.
          await Excel.run(async (context) => {
            const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
            const range: Excel.Range = sheet.getRange("A1");
            range.load("valuesAsJson");
            await context.sync();

            const cellValue: Excel.CellValue = range.valuesAsJson[0][0];
            if (cellValue.type === Excel.CellValueType.error && cellValue.errorType === Excel.ErrorCellValueType.busy) {
              range.values = [["Process unavailable."]];
            }

            await context.sync();
          });
        }

        async function inspectUnavailableValue() {
          // Read the fallback properties of a value that Excel can't serialize.
          await Excel.run(async (context) => {
            const sheet: Excel.Worksheet = context.workbook.worksheets.getItem("Sample");
            const range: Excel.Range = sheet.getRange("B1");
            range.load("valuesAsJson");
            await context.sync();

            const cellValue: Excel.CellValue = range.valuesAsJson[0][0];
            if (cellValue.type === Excel.CellValueType.notAvailable) {
              const unavailableValue: Excel.ValueTypeNotAvailableCellValue = cellValue;
              console.log("B1 value type:", unavailableValue.type);
              console.log("B1 fallback type:", unavailableValue.basicType);
              console.log("B1 fallback value:", unavailableValue.basicValue);
            } else {
              console.log("B1 value type:", cellValue.type);
              console.log("B1's value type is supported. No unavailable-type fallback was returned.");
            }
          });
        }

        async function setup() {
          await Excel.run(async (context) => {
            // Create a new worksheet called "Sample" and activate it.
            context.workbook.worksheets.getItemOrNullObject("Sample").delete();
            const sheet = context.workbook.worksheets.add("Sample");
            sheet.getRange("A1:B1").values = [["Ready", "Sample text"]];
            sheet.getRange("A:B").format.autofitColumns();
            sheet.activate();
            await context.sync();
          });
        }

        /** Default helper for invoking an action and handling errors. */
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
          <p>Set and replace a #BUSY! error in A1, and inspect the value type of B1 without changing its contents.</p>
        </section>
        <section class="setup">
          <h3>Set up</h3>
          <button id="setup">Set up</button>
        </section>
        <section>
          <h3>Try it out</h3>
          <button id="set-busy-error">Set A1 to #BUSY! error</button>
          <button id="change-busy-error">Replace #BUSY! error in A1</button>
          <p>Inspect B1 to see its value type in the console. Setup creates a String value. You can replace it with another value: Stocks and Geography normally return LinkedEntity, and in-cell pictures can return LocalImage.</p>
          <p>The inspection also includes conditional handling for NotAvailable, which Excel returns when it can't serialize a value type. For example, a rich value not recognized by this version of Excel would appear as #UNKNOWN!.</p>
          <p>To inspect fallback properties, B1 must contain a value whose type Excel can't serialize and therefore returns as NotAvailable.</p>
          <button id="inspect-unavailable-value">Inspect value type in B1</button>
        </section>
    language: html
