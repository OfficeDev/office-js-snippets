name: auto-publish
run-name: Automatically publish snippets
on:
  schedule:
    # Run at 10:15 AM UTC on Tuesday and Thursday.
    - cron: '15 10 * * TUE'
    - cron: '15 10 * * THU'
jobs:
  auto-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ./
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Check out main
        run: |
          echo "Checking out main branch"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout main
      - name: Check out prod
        run: |
          echo "Checking out prod branch"
          git checkout prod
      - name: Merge from main into prod
        run: |
          echo "Merging from main to prod"
          git merge main
      - name: Push changes
        run: |
          echo "Pushing changes to prod branch"
          git push origin prod

