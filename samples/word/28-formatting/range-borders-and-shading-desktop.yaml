order: 10
id: word-formatting-range-borders-and-shading-desktop
name: Range borders and shading (desktop)
description: Applies and reads border formatting and background shading on a paragraph range.
author: OfficeDev
host: WORD
api_set:
    WordApi: '1.3'
    WordApiDesktop: '1.4'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("set-borders").addEventListener("click", () => tryCatch(setBorders));
        document.getElementById("get-borders").addEventListener("click", () => tryCatch(getBorders));
        document.getElementById("set-shading").addEventListener("click", () => tryCatch(setShading));
        document.getElementById("get-shading").addEventListener("click", () => tryCatch(getShading));

        async function setBorders() {
            // Changes the first paragraph's text borders to double blue lines.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const borders: Word.BorderUniversalCollection = paragraphRange.borders;
                borders.load("items");
                await context.sync();

                borders.items.forEach((border: Word.BorderUniversal) => {
                    border.color = "#4472C4";
                    border.lineStyle = Word.BorderLineStyle.double;
                    border.lineWidth = Word.LineWidth.pt150;
                    border.isVisible = true;
                });
                await context.sync();
                console.log("Applied double blue borders to the first paragraph's text.");
            });
        }

        async function getBorders() {
            // Reads the border formatting of the first paragraph's text.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const borders: Word.BorderUniversalCollection = paragraphRange.borders;
                borders.load("items/color,items/lineStyle,items/lineWidth,items/isVisible");
                await context.sync();
                console.log("First paragraph's border formatting:");
                borders.items.forEach((border: Word.BorderUniversal) => {
                    console.log("Border:", {
                        color: border.color,
                        lineStyle: border.lineStyle,
                        lineWidth: border.lineWidth,
                        isVisible: border.isVisible
                    });
                });
            });
        }

        async function setShading() {
            // Adds a pale blue background to the first paragraph's text.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const shading: Word.ShadingUniversal = paragraphRange.shading;
                shading.backgroundPatternColor = "#DDEBF7";
                await context.sync();
                console.log("Applied pale blue shading.");
            });
        }

        async function getShading() {
            // Reads the background shading color of the first paragraph's text.
            await Word.run(async (context) => {
                const paragraphRange: Word.Range = context.document.body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const shading: Word.ShadingUniversal = paragraphRange.shading;
                shading.load("backgroundPatternColor");
                await context.sync();
                console.log(`Range shading color: ${shading.backgroundPatternColor}`);
            });
        }

        async function setup() {
            await Word.run(async (context) => {
                const body: Word.Body = context.document.body;
                body.insertText("Project summary: borders and shading emphasize this text.", Word.InsertLocation.replace);
                const paragraphRange: Word.Range = body.paragraphs.getFirst().getRange(Word.RangeLocation.content);
                const shading: Word.ShadingUniversal = paragraphRange.shading;
                shading.backgroundPatternColor = "#FFFFFF";
                shading.texture = Word.ShadingTextureType.none;
                const borders: Word.BorderUniversalCollection = paragraphRange.borders;
                borders.load("items");
                await context.sync();

                borders.items.forEach((border: Word.BorderUniversal) => {
                    border.color = "#808080";
                    border.lineStyle = Word.BorderLineStyle.single;
                    border.lineWidth = Word.LineWidth.pt075;
                    border.isVisible = true;
                });
                await context.sync();
                console.log("Created sample text with thin gray borders and a white background.");
            });
        }

        async function tryCatch(callback) {
            try {
                await callback();
            } catch (error) {
                console.error(error);
            }
        }
    language: typescript
template:
    content: |-
        <section>This sample shows how borders and background shading emphasize a report's summary text.</section>
        <section><p><b>Support:</b> Requires WordApiDesktop 1.4 on Windows or Mac.</p></section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Replaces the document body with sample text, thin gray borders, and a white background. Repeating setup restores this formatting.</p>
            <button id="setup">Create sample text</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <p>Border and shading actions independently format the first paragraph's text. "Get" actions log the current settings.</p>
            <button id="set-borders">Apply double blue borders</button>
            <button id="get-borders">Get range borders</button>
            <button id="set-shading">Apply pale blue shading</button>
            <button id="get-shading">Get range shading</button>
        </section>
    language: html
