order: 13
id: word-document-insert-section-breaks
name: Manage sections
description: Creates sections, reads their content, and navigates between them.
host: WORD
api_set:
    WordApi: '1.3'
script:
    content: |-
        document.getElementById("setup").addEventListener("click", () => tryCatch(setup));
        document.getElementById("get-first-section").addEventListener("click", () => tryCatch(getFirstSection));
        document.getElementById("get-sections").addEventListener("click", () => tryCatch(getSections));
        document.getElementById("get-next-section").addEventListener("click", () => tryCatch(getNextSection));
        document.getElementById("add-next-section").addEventListener("click", () => tryCatch(addNext));
        document.getElementById("add-even-section").addEventListener("click", () => tryCatch(addEven));
        document.getElementById("add-odd-section").addEventListener("click", () => tryCatch(addOdd));
        document.getElementById("add-continuous-section").addEventListener("click", () => tryCatch(addContinuous));

        async function getFirstSection() {
          // Gets the first section and reads the text in its body.
          await Word.run(async (context) => {
            const sections: Word.SectionCollection = context.document.sections;
            const firstSection: Word.Section = sections.getFirst();
            const firstSectionBody: Word.Body = firstSection.body;
            firstSectionBody.load("text");

            await context.sync();

            console.log(`First section text: ${firstSectionBody.text}`);
          });
        }

        async function getSections() {
          // Gets every section and reads the text in each section body.
          await Word.run(async (context) => {
            const sections: Word.SectionCollection = context.document.sections;
            sections.load("items/body/text");

            await context.sync();

            sections.items.forEach((section: Word.Section, index: number) => {
              console.log(`Section ${index + 1}: ${section.body.text}`);
            });
          });
        }

        async function getNextSection() {
          // Navigates from the first section to the next section when one exists.
          await Word.run(async (context) => {
            const sections: Word.SectionCollection = context.document.sections;
            const firstSection: Word.Section = sections.getFirst();
            const nextSection: Word.Section = firstSection.getNextOrNullObject();
            nextSection.load("isNullObject, body/text");

            await context.sync();

            if (nextSection.isNullObject) {
              console.log("The document doesn't have another section.");
              return;
            }

            console.log(`Next section text: ${nextSection.body.text}`);
          });
        }

        async function addNext() {
          // Adds a section that begins on the next page.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.insertBreak(Word.BreakType.sectionNext, Word.InsertLocation.end);
            body.insertParagraph("Next-page section", Word.InsertLocation.end);

            await context.sync();

            console.log("Added a section that begins on the next page.");
          });
        }

        async function addEven() {
          // Adds a section that begins on the next even-numbered page.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.insertBreak(Word.BreakType.sectionEven, Word.InsertLocation.end);
            body.insertParagraph("Even-page section", Word.InsertLocation.end);

            await context.sync();

            console.log("Added a section that begins on the next even-numbered page.");
          });
        }

        async function addOdd() {
          // Adds a section that begins on the next odd-numbered page.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.insertBreak(Word.BreakType.sectionOdd, Word.InsertLocation.end);
            body.insertParagraph("Odd-page section", Word.InsertLocation.end);

            await context.sync();

            console.log("Added a section that begins on the next odd-numbered page.");
          });
        }

        async function addContinuous() {
          // Adds a section at the current position without adding a page break.
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            const insertLocation: Word.InsertLocation = Word.InsertLocation.end;
            body.insertBreak(Word.BreakType.sectionContinuous, insertLocation);
            body.insertParagraph("Continuous section", insertLocation);

            await context.sync();

            console.log("Added a section without adding a page break.");
          });
        }

        async function setup() {
          await Word.run(async (context) => {
            const body: Word.Body = context.document.body;
            body.clear();
            body.insertParagraph("Executive summary", Word.InsertLocation.end);
            body.insertParagraph("This section summarizes the quarterly report.", Word.InsertLocation.end);
            body.insertBreak(Word.BreakType.sectionNext, Word.InsertLocation.end);
            body.insertParagraph("Sales analysis", Word.InsertLocation.end);
            body.insertParagraph("This section reviews quarterly sales results.", Word.InsertLocation.end);
            body.insertBreak(Word.BreakType.sectionNext, Word.InsertLocation.end);
            body.insertParagraph("Appendix", Word.InsertLocation.end);
            body.insertParagraph("This section contains supporting data.", Word.InsertLocation.end);

            await context.sync();
            console.log("Created a report with three sections.");
          });
        }

        // Default helper for invoking an action and handling errors.
        async function tryCatch(callback) {
          try {
            await callback();
          } catch (error) {
            // Note: In a production add-in, you'd want to notify the user through your add-in's UI.
            console.error(error);
          }
        }
    language: typescript
template:
    content: |-
        <section>
            <p>Organize a report into sections, inspect each section's content, and move between sections.</p>
        </section>
        <section class="setup">
            <h3>Set up</h3>
            <p>Create a three-section report with an executive summary, sales analysis, and appendix.</p>
            <button id="setup">Set up the sample</button>
        </section>
        <section>
            <h3>Try it out</h3>
            <button id="get-first-section">Get first section</button>
            <button id="get-sections">Get all sections</button>
            <button id="get-next-section">Get next section</button>
            <h4>Add a section</h4>
            <button id="add-next-section">Start on next page</button>
            <button id="add-even-section">Start on next even page</button>
            <button id="add-odd-section">Start on next odd page</button>
            <button id="add-continuous-section">Start at current position</button>
            <p>Show formatting marks to see the section breaks. For details, see <a target="_blank" href="https://support.microsoft.com/office/84a53213-5d02-404a-b022-09cae1a3958b">Show or hide tab marks in Word</a>.</p>
        </section>
    language: html
